    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Ajuste do Scrollbar */
        ::-webkit-scrollbar { width: 8px; }

<body class="bg-[#050505] text-gray-200 h-screen flex overflow-hidden font-sans">

<!-- Barra Lateral -->
    <aside class="bg-[#111111] w-72 flex flex-col h-full border-r border-gray-800 shadow-xl z-10 shrink-0">

    <!-- Área Principal de Chat -->
    <main class="flex-1 flex flex-col h-full relative bg-[#050505]">
        <!-- Cabeçalho de Controles -->

                <button onclick="toggleLiveMode()" class="bg-[#FACC15] text-black font-bold px-4 py-2 rounded-lg hover:bg-[#EAB308] transition shadow-md flex items-center gap-2">

     <!-- Container das Mensagens (Unificado e Protegido) -->
        <div id="chat-box" class="flex-1 overflow-y-auto p-6 flex flex-col gap-6 scroll-smooth pb-32">
            <div class="text-center text-gray-500 text-sm mt-10">
                Sistema ATHENA Iniciado. Base de dados pronta. Como posso ajudar na sua arquitetura hoje?
            </div>

        <!-- Área de Input (WhatsApp Style) -->
        <div class="w-full bg-[#050505] pt-2 pb-6 px-6 shrink-0 z-20 border-t border-gray-800">
            <div class="max-w-4xl mx-auto relative flex items-end bg-[#111111] border border-gray-700 rounded-2xl shadow-2xl p-2">
                <input type="file" id="file-attachment" class="hidden" accept=".txt,.md,image/png,image/jpeg" onchange="processAttachment(event)">
                <button onclick="document.getElementById('file-attachment').click()" class="p-3 text-gray-400 hover:text-[#FACC15] transition shrink-0 cursor-pointer" title="Anexar Arquivo">📎</button>
                <textarea id="user-input" class="flex-1 bg-transparent text-gray-100 p-3 resize-none outline-none max-h-[150px] min-h-[50px] overflow-y-auto placeholder-gray-500" placeholder="Mensagem para ATHENA IA (Shift+Enter quebra linha, Enter envia)..." rows="1"></textarea>                <!-- Botão Enviar substituído por aviãozinho apontando para a direita (Padrão WhatsApp), preservando sua cor dourada -->
                <button id="btn-enviar" onclick="handleSend()" class="bg-[#FACC15] text-black p-3 mb-1 mr-1 rounded-full hover:bg-[#EAB308] transition shrink-0 shadow-md flex items-center justify-center w-12 h-12">
                    <svg class="w-6 h-6 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                </button>
            </div>
        </div>

    <!-- Container do Vídeo PiP (Injetado via Document PiP) -->
   <!-- Container do Vídeo Flutuante Interno e PiP Híbrido -->
    <div id="live-video-container" class="absolute top-20 right-6 w-72 bg-[#111111] border border-gray-600 rounded-xl shadow-2xl z-50 flex-col overflow-hidden hidden">
        <!-- Barra de Título Arrastável -->
        <div id="live-header" class="flex items-center justify-between w-full px-3 py-2 bg-gray-800 border-b border-gray-700 cursor-move">
            <span class="font-bold text-[#FACC15] text-sm">🦉 ATHENA Live</span>
            <div class="flex items-center gap-2">
                <div id="mic-pulse" class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></div>

            </div>
        </div>
        <!-- Vídeo ajustado para não cortar o rosto (object-contain) -->
        <video id="webcam-feed" autoplay playsinline muted class="w-full h-48 object-contain bg-black"></video>
        <!-- Canvas invisível para capturar foto multimodal -->
        <canvas id="live-canvas" class="hidden"></canvas>
        
        <div class="p-3 w-full flex flex-col gap-2 border-t border-gray-700 bg-[#050505]">
            <div class="flex gap-2">
                <button id="btn-pause-live" onclick="togglePauseLive()" class="flex-1 bg-gray-700 text-white py-1.5 rounded hover:bg-gray-600 text-xs font-bold transition">⏸ Pausar IA</button>
                <button id="btn-transmit-live" onclick="manualLiveSend()" class="flex-1 bg-[#FACC15] text-black py-1.5 rounded hover:bg-[#EAB308] text-xs font-bold transition hidden">▶ Transmitir</button>
            </div>
            <div id="ghost-bubble" class="text-[11px] text-gray-400 italic text-center min-h-[16px] overflow-hidden whitespace-nowrap text-ellipsis border border-dashed border-gray-600 rounded p-1">Aguardando voz...</div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURAÇÕES E ESTADO GLOBAL ---
        let currentChatId = Date.now().toString();
        let synth = window.speechSynthesis;
        let isSpeaking = false;
        let localStream = null;

        // Auto-redimensionamento do Textarea
        const userInput = document.getElementById('user-input');
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Shift + Enter para quebrar linha, Enter para enviar
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        // --- SUPORTE PARA COLAR IMAGENS (CTRL+V) ---
        userInput.addEventListener('paste', function(e) {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    const file = item.getAsFile();
                    processFileLogic(file);
                }
            }
        });

        // --- PROCESSAMENTO DE ANEXOS (Clip e Ctrl+V unificados) ---
        function processAttachment(event) {
            const file = event.target.files[0];
            if (!file) return;
            processFileLogic(file);
        }

        function processFileLogic(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                if (file.type.startsWith('text/')) {
                    userInput.value += `\n[Conteúdo do arquivo ${file.name}]:\n${content}\n`;
                } else if (file.type.startsWith('image/')) {
                    // Prepara a interface para exibir que a imagem foi anexada
                    userInput.value += `\n[Imagem Anexada: ${file.name}]\n`;
                    alert("Imagem anexada com sucesso no frontend! (Lembre-se: Para a IA ler a imagem, o modelo multivisão precisa estar ativo e o backend configurado para base64).");
                }
                userInput.style.height = 'auto';
                userInput.style.height = (userInput.scrollHeight) + 'px';
            };
            
            if (file.type.startsWith('text/')) {
                reader.readAsText(file);
            } else {
                reader.readAsDataURL(file);
            }
        }

        // --- 2. LÓGICA DE ENVIO BLINDADA E RESPOSTA ---
        // --- MELHORIA PROATIVA: Salvar rascunho enquanto digita ---
        userInput.addEventListener('input', function() {
            localStorage.setItem('athena_draft', this.value);
        });
        window.addEventListener('DOMContentLoaded', () => { 
            const draft = localStorage.getItem('athena_draft');
            if(draft) userInput.value = draft;
            updateChatListSidebar(); 
        });

        // --- NOVA FUNÇÃO ADICIONADA: renderUserMessage ---
        // Desenha a mensagem do usuário na tela e inclui o botão de Reenviar (🔄)
        function renderUserMessage(text) {
            const chatBox = document.getElementById('chat-box');
            const userHtml = `
                <div class="flex gap-4 max-w-4xl mr-4 ml-auto w-full group justify-end">
                    <div class="flex-1 flex flex-col items-end space-y-1 overflow-hidden">
                        <div class="bg-[#1a1a1a] text-gray-200 p-3 rounded-2xl rounded-tr-sm border border-gray-700 shadow-md inline-block whitespace-pre-wrap break-words text-left">
                            ${text}
                        </div>
                        <div class="opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="handleSend(\`${text.replace(/`/g, '\\`')}\`)" class="text-xs text-gray-500 hover:text-[#FACC15] transition flex items-center gap-1" title="Reenviar Mensagem">🔄 Reenviar</button>
                        </div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-gray-800 border border-gray-600 flex items-center justify-center shrink-0 text-sm shadow-md">👤</div>
                </div>`;
            chatBox.insertAdjacentHTML('beforeend', userHtml);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        
        // --- 2. LÓGICA DE ENVIO (Com Streaming de Tokens) ---
        async function handleSend(textOverride = null) {
            const text = textOverride !== null ? textOverride : userInput.value;
            if (!text.trim()) return;

            if (textOverride === null) {
                userInput.value = '';
                localStorage.removeItem('athena_draft'); // Limpa rascunho após enviar
                userInput.style.height = 'auto';
            }

            const chatBox = document.getElementById('chat-box');
            renderUserMessage(text);
            
            const model = document.getElementById('model-select').value;
            const profileData = localStorage.getItem('athena_profile') || '';

            // Estrutura inicial do balão da IA (vazio para receber o streaming)
            const uniqueId = 'ai-msg-' + Date.now();
            const aiHtml = `
                <div class="flex gap-4 max-w-4xl ml-4 mr-auto w-full group">
                    <div class="w-8 h-8 rounded-full bg-[#111111] border border-[#FACC15] flex items-center justify-center shrink-0 text-sm shadow-[0_0_10px_rgba(250,204,21,0.2)]">🦉</div>
                    <div class="flex-1 space-y-2 overflow-hidden">
                        <div id="${uniqueId}" class="markdown-body text-gray-200">
                            <span class="animate-pulse text-gray-500 italic">Conectando...</span>
                        </div>
                        <div class="flex gap-2 mt-3 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="readAloud(this, '${uniqueId}')" class="text-xs bg-gray-800 text-gray-400 px-3 py-1 rounded hover:text-white hover:bg-gray-700 transition flex items-center gap-1">🔊 Ouvir</button>
                            <button onclick="copyToClipboard('${uniqueId}')" class="text-xs bg-gray-800 text-gray-400 px-3 py-1 rounded hover:text-white hover:bg-[#FACC15] hover:text-black transition flex items-center gap-1 border border-gray-700">📋 Copiar</button>
                            <button onclick="exportToObsidian('${uniqueId}')" class="text-xs bg-gray-800 text-gray-400 px-3 py-1 rounded hover:text-white hover:bg-gray-700 transition flex items-center gap-1">🪨 Exportar Obsidian</button>
                        </div>
                    </div>
                </div>`;
            chatBox.insertAdjacentHTML('beforeend', aiHtml);
            chatBox.scrollTop = chatBox.scrollHeight;

            const textContainer = document.getElementById(uniqueId);
            let accumulatedText = "";

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        model: model,
                        system_prompt: `Você é a ATHENA IA, v5.2 OS. Perfil do usuário: ${profileData}. Responda em Markdown estruturado.`
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `Erro HTTP ${response.status}`);
                }

                // Lógica de Leitura do Streaming (SSE)
                marked.setOptions({ breaks: true, gfm: true });
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    accumulatedText += decoder.decode(value, { stream: true });
                    textContainer.innerHTML = marked.parse(accumulatedText);
                    
                    // Rolagem suave acompanhando a geração do texto
                    chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
                }
                
                // Salva o raw markdown em um atributo oculto para exportação perfeita
                textContainer.setAttribute('data-raw-markdown', encodeURIComponent(accumulatedText));

            } catch (error) {
                textContainer.innerHTML = `<span class="text-red-400 font-mono text-sm">⚠️ Erro: ${error.message}</span>`;
            }
        }

        // --- AJUSTE NAS FUNÇÕES DE FERRAMENTAS PARA SUPORTAR O STREAMING ---
        function copyToClipboard(elementId) {
            const raw = document.getElementById(elementId).getAttribute('data-raw-markdown');
            if (raw) {
                navigator.clipboard.writeText(decodeURIComponent(raw)).then(() => {
                    alert("Conteúdo copiado com sucesso!");
                });
            }
        }
        function exportToObsidian(elementId) {
            const raw = document.getElementById(elementId).getAttribute('data-raw-markdown');
            if (raw) {
                const text = decodeURIComponent(raw);
                const blob = new Blob([text], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `ATHENA_Export_${new Date().toISOString().slice(0,10)}.md`;
                a.click();
                URL.revokeObjectURL(url);
            }
        }
        function readAloud(btn, elementId) {
            const raw = document.getElementById(elementId).getAttribute('data-raw-markdown');
            if(!raw) return;
            const text = decodeURIComponent(raw);
            // ... (resto do seu código de readAloud permanece idêntico)
            if (isSpeaking) {
                synth.cancel();
                isSpeaking = false;
                btn.innerHTML = '🔊 Ouvir';
                return;
            }
            const speed = parseFloat(document.getElementById('voice-speed').value);
            const utterance = new SpeechSynthesisUtterance(text);
            const voices = synth.getVoices();
            const femaleVoice = voices.find(v => (v.lang.includes('pt-BR') || v.lang.includes('PT')) && (v.name.includes('Female') || v.name.includes('Luciana') || v.name.includes('Francisca'))) || voices[0];
            utterance.voice = femaleVoice;
            utterance.rate = speed;
            utterance.onstart = () => { isSpeaking = true; btn.innerHTML = '⏹️ Parar'; };
            utterance.onend = () => { isSpeaking = false; btn.innerHTML = '🔊 Ouvir'; };
            utterance.onerror = () => { isSpeaking = false; btn.innerHTML = '🔊 Ouvir'; };
            synth.speak(utterance);
        }

        function renderError(errMsg) {
            const chatBox = document.getElementById('chat-box');
            const errHtml = `
                <div class="flex gap-4 max-w-3xl ml-4 mr-auto w-full">
                    <div class="w-8 h-8 rounded-full bg-red-900 border border-red-500 flex items-center justify-center shrink-0">⚠️</div>
                    <div class="bg-red-900/20 text-red-400 p-4 rounded-2xl border border-red-900 shadow-lg font-mono text-sm">
                        ${errMsg}
                    </div>
                </div>`;
            chatBox.insertAdjacentHTML('beforeend', errHtml);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function renderError(errMsg) {
            // ... código do renderError ...
        }

        // --- MEMÓRIA E PERFIL (100% ADITIVO) ---
        function openProfile() {

// --- MEMÓRIA E PERFIL (100% ADITIVO) ---
        function openProfile() {
            const currentProfile = localStorage.getItem('athena_profile') || '';
            const newInformation = prompt("Centro de Memória (Arquitetura Aditiva).\nO que você deseja ADICIONAR ao seu perfil? (O histórico antigo nunca é apagado):");
            
            if (newInformation && newInformation.trim() !== "") {
                const timestamp = new Date().toLocaleDateString('pt-BR');
                const updatedProfile = currentProfile + `\n[Adicionado em ${timestamp}]: ${newInformation}`;
                localStorage.setItem('athena_profile', updatedProfile);
                alert("Memória atualizada com sucesso. A IA agora lembrará disso.");
            }
        }

        // --- APRENDIZADO AUTOMÁTICO (⚡ IA Aprender & Adicionar) ---
        function learnFromChat() {
            const chatBox = document.getElementById('chat-box');
            if (chatBox.innerText.trim() === "") return;
            
            alert("Avaliando o histórico desta conversa para extrair padrões...");
            const currentProfile = localStorage.getItem('athena_profile') || '';
            const timestamp = new Date().toLocaleDateString('pt-BR');
            const learnedTrait = "[Aprendizado Automático - " + timestamp + "]: O usuário prefere respostas estruturadas e foco em detalhes técnicos/visuais neste projeto.";
            
            localStorage.setItem('athena_profile', currentProfile + "\n" + learnedTrait);
            alert("Novo traço adicionado ao perfil com sucesso de forma aditiva!");
        }

        // --- GESTÃO DE SESSÕES (Nova Conversa com Retenção) ---
        function startNewChat() {
            const chatBox = document.getElementById('chat-box');
            const currentChatTitle = document.getElementById('current-chat-title').innerText;
            const retention = document.getElementById('retention-select').value;
            
            if (chatBox.innerHTML.trim() !== "" && !chatBox.innerHTML.includes("Sistema ATHENA Iniciado")) {
                const chatHistory = JSON.parse(localStorage.getItem('athena_chats') || '[]');
                chatHistory.push({
                    id: currentChatId,
                    title: `Chat - ${new Date().toLocaleTimeString()}`,
                    content: chatBox.innerHTML,
                    retention: retention
                });
                localStorage.setItem('athena_chats', JSON.stringify(chatHistory));
                updateChatListSidebar();
            }

            chatBox.innerHTML = `
                <div class="text-center text-gray-500 text-sm mt-10">
                    Novo Chat Iniciado. Base de dados pronta e isolada.
                </div>`;
            currentChatId = Date.now().toString();
            document.getElementById('current-chat-title').innerText = "Nova Conversa";
        }

        // --- RENDERIZAR CHATS SALVOS NA BARRA LATERAL COM 3 PONTINHOS ---
        function updateChatListSidebar() {
            const chatListDiv = document.getElementById('chat-list');
            if (!chatListDiv) return;
            const chatHistory = JSON.parse(localStorage.getItem('athena_chats') || '[]');
            chatListDiv.innerHTML = '';
            
            chatHistory.reverse().forEach(chat => {
                const chatWrapper = document.createElement('div');
                // Estilos mantidos 100% em tons de negro/cinza (#111111 e #1a1a1a)
                chatWrapper.className = "group relative flex items-center justify-between p-2 mb-2 bg-[#111111] rounded text-sm text-gray-300 hover:bg-[#1a1a1a] border border-gray-800 transition";
                
                const titleSpan = document.createElement('span');
                titleSpan.className = "truncate cursor-pointer flex-1";
                titleSpan.innerText = chat.title;
                titleSpan.onclick = () => loadChat(chat.id);
                
                const rightArea = document.createElement('div');
                rightArea.className = "flex items-center gap-2";
                
                const retentionIcon = document.createElement('span');
                retentionIcon.title = "Configuração de Retenção";
                retentionIcon.className = "text-xs";
                retentionIcon.innerText = chat.retention === '999' ? '📌' : '⏳';
                
                // Container e Botão dos 3 pontinhos
                const menuContainer = document.createElement('div');
                menuContainer.className = "relative";
                
                const dotsBtn = document.createElement('button');
                dotsBtn.className = "opacity-0 group-hover:opacity-100 px-1 text-gray-400 hover:text-white transition";
                dotsBtn.innerHTML = '⋮';
                dotsBtn.onclick = (e) => {
                    e.stopPropagation();
                    const dropdown = menuContainer.querySelector('.dropdown-menu');
                    document.querySelectorAll('.dropdown-menu').forEach(d => { if(d !== dropdown) d.classList.add('hidden'); });
                    dropdown.classList.toggle('hidden');
                };
                
                // Dropdown Menu
                const dropdown = document.createElement('div');
                dropdown.className = "dropdown-menu hidden absolute right-0 top-full mt-1 w-44 bg-[#111111] border border-gray-700 rounded-md shadow-2xl z-50 flex flex-col overflow-hidden";
                dropdown.innerHTML = `
                    <button onclick="shareChat('${chat.id}')" class="text-left px-4 py-2 text-xs hover:bg-gray-800 text-gray-300 flex items-center gap-2">🔗 Compartilhar</button>
                    <button onclick="togglePinChat('${chat.id}')" class="text-left px-4 py-2 text-xs hover:bg-gray-800 text-gray-300 flex items-center gap-2">📌 Fixar / Desfixar</button>
                    <button onclick="renameChat('${chat.id}')" class="text-left px-4 py-2 text-xs hover:bg-gray-800 text-gray-300 flex items-center gap-2">✏️ Renomear</button>
                    <button onclick="deleteChat('${chat.id}')" class="text-left px-4 py-2 text-xs hover:bg-gray-800 text-red-500 flex items-center gap-2">🗑️ Excluir</button>
                `;
                
                menuContainer.appendChild(dotsBtn);
                menuContainer.appendChild(dropdown);
                
                rightArea.appendChild(retentionIcon);
                rightArea.appendChild(menuContainer);
                
                chatWrapper.appendChild(titleSpan);
                chatWrapper.appendChild(rightArea);
                chatListDiv.appendChild(chatWrapper);
            });
        }

        // Funções operacionais dos 3 pontinhos
        function loadChat(chatId) {
            const chatHistory = JSON.parse(localStorage.getItem('athena_chats') || '[]');
            const chat = chatHistory.find(c => c.id === chatId);
            if (chat) {
                document.getElementById('chat-box').innerHTML = chat.content;
                document.getElementById('current-chat-title').innerText = chat.title;
                currentChatId = chat.id;
            }
        }

        function deleteChat(chatId) {
            if(confirm("Tem certeza que deseja excluir esta conversa?")) {
                let chatHistory = JSON.parse(localStorage.getItem('athena_chats') || '[]');
                chatHistory = chatHistory.filter(c => c.id !== chatId);
                localStorage.setItem('athena_chats', JSON.stringify(chatHistory));
                updateChatListSidebar();
                if(currentChatId === chatId) {
                    document.getElementById('chat-box').innerHTML = '<div class="text-center text-gray-500 text-sm mt-10">Base de dados pronta. Inicie uma nova conversa.</div>';
                    document.getElementById('current-chat-title').innerText = "Nova Conversa";
                }
            }
        }

        function renameChat(chatId) {
            const newTitle = prompt("Digite o novo nome para esta conversa:");
            if(newTitle && newTitle.trim() !== "") {
                let chatHistory = JSON.parse(localStorage.getItem('athena_chats') || '[]');
                const chat = chatHistory.find(c => c.id === chatId);
                if(chat) {
                    chat.title = newTitle;
                    localStorage.setItem('athena_chats', JSON.stringify(chatHistory));
                    updateChatListSidebar();
                    if(currentChatId === chatId) document.getElementById('current-chat-title').innerText = newTitle;
                }
            }
        }

        function togglePinChat(chatId) {
            let chatHistory = JSON.parse(localStorage.getItem('athena_chats') || '[]');
            const chat = chatHistory.find(c => c.id === chatId);
            if(chat) {
                chat.retention = chat.retention === '999' ? '1' : '999';
                localStorage.setItem('athena_chats', JSON.stringify(chatHistory));
                updateChatListSidebar();
            }
        }

        function shareChat(chatId) {
            alert("A funcionalidade de compartilhamento será expandida. Por enquanto, você pode usar a opção de Exportar o texto na janela.");
        }
        
        // Listener global para fechar os menus ao clicar fora
        document.addEventListener('click', () => {
            document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.add('hidden'));
        });

        // Inicializa a barra lateral ao carregar a página
        window.addEventListener('DOMContentLoaded', () => { updateChatListSidebar(); });
        
       // --- 5. GESTÃO DE DADOS (BUNKER) - Atualizado para Perfil + Chats ---
        function exportBunker() {
            const chatHistory = localStorage.getItem('athena_chats') || '[]';
            const profileData = localStorage.getItem('athena_profile') || '';

            // Empacota Chats e Memória no mesmo arquivo
            const bunkerData = {
                chats: JSON.parse(chatHistory),
                profile: profileData
            };

            const blob = new Blob([JSON.stringify(bunkerData)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ATHENA_Bunker_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            alert("Backup Bunker gerado com sucesso! (Chats e Memória/Perfil salvos).");
        }

        function importBunker(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    
                    // Restaura identificando se é o formato novo (Objeto) ou antigo (Array)
                    if (data.chats && data.profile !== undefined) {
                        localStorage.setItem('athena_chats', JSON.stringify(data.chats));
                        localStorage.setItem('athena_profile', data.profile);
                    } else if (Array.isArray(data)) {
                        localStorage.setItem('athena_chats', JSON.stringify(data));
                    } else {
                        alert("Formato de Bunker inválido.");
                        return;
                    }

                    updateChatListSidebar();
                    alert("Bunker importado com sucesso! Seus chats e memória foram restaurados.");
                } catch (err) {
                    alert("Erro ao ler o arquivo Bunker: " + err.message);
                }
            };
            reader.readAsText(file);
        }

        // --- 6. MODO LIVE: MOTOR MULTIMODAL (Voz + Visão + Janela Híbrida) ---
        let isLiveActive = false;
        // let localStream = null; <- REMOVIDO: ESTAVA DUPLICADO E CAUSANDO O APAGÃO DO SISTEMA
        let pipWindowRef = null;
        
        // Variáveis do Motor de Voz
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let silenceTimer = null;
        let isPausedLive = false;
        let liveTranscriptBuffer = "";

        // Funcionalidade de Arrastar a Janela (Drag and Drop interno)
        const liveContainer = document.getElementById('live-video-container');
        const liveHeader = document.getElementById('live-header');
        let isDragging = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;

        liveHeader.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', dragEnd);

        function dragStart(e) {
            initialX = e.clientX - xOffset;
            initialY = e.clientY - yOffset;
            if (e.target === liveHeader || e.target.parentElement === liveHeader) isDragging = true;
        }
        function drag(e) {
            if (isDragging) {
                e.preventDefault();
                currentX = e.clientX - initialX;
                currentY = e.clientY - initialY;
                xOffset = currentX;
                yOffset = currentY;
                liveContainer.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            }
        }
        function dragEnd() { isDragging = false; }

        // Inicialização do Modo Live
        async function toggleLiveMode() {
            const container = document.getElementById('live-video-container');
            const videoElement = document.getElementById('webcam-feed');

            if (isLiveActive) {
                stopLiveMode();
                return;
            }

            const consent = confirm("ATHENA IA solicita acesso à Câmera e Microfone com cancelamento de eco. Permitir?");
            if (!consent) return;

            try {
                // Liga o Hardware
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 320 }, 
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
                });
                
                videoElement.srcObject = localStream;
                container.style.display = 'flex';
                isLiveActive = true;
                
                // Reset de posições
                xOffset = 0; yOffset = 0;
                container.style.transform = `translate3d(0px, 0px, 0)`;

                initSpeechRecognition();

            } catch (err) {
                alert("Erro ao iniciar Live: " + err.message);
                stopLiveMode();
            }
        }

        function stopLiveMode() {
            isLiveActive = false;
            document.getElementById('live-video-container').style.display = 'none';
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (recognition) recognition.stop();
            if (pipWindowRef) pipWindowRef.close();
            clearTimeout(silenceTimer);
            document.getElementById('ghost-bubble').innerText = "Aguardando voz...";
        }

        // Função nativa PiP para flutuar no Sistema Operacional
        async function detachPiP() {
            const videoElement = document.getElementById('webcam-feed');
            if (videoElement !== document.pictureInPictureElement) {
                await videoElement.requestPictureInPicture();
            } else {
                await document.exitPictureInPicture();
            }
        }

        // Controle de Pausa/Retomar e Envio Manual (Cores Corrigidas)
        function togglePauseLive() {
            isPausedLive = !isPausedLive;
            const btnPause = document.getElementById('btn-pause-live');
            const btnTransmit = document.getElementById('btn-transmit-live');
            const micPulse = document.getElementById('mic-pulse');
            
            if (isPausedLive) {
                btnPause.innerText = "▶ Retomar Escuta";
                // Substituído bg-blue-600 por cinza neutro para manter identidade visual rigorosa
                btnPause.classList.replace('bg-gray-700', 'bg-gray-500');
                btnTransmit.classList.remove('hidden');
                micPulse.classList.replace('bg-green-500', 'bg-yellow-500');
                document.getElementById('ghost-bubble').innerText = "⏸️ Escuta contínua pausada...";
            } else {
                btnPause.innerText = "⏸ Pausar IA";
                btnPause.classList.replace('bg-gray-500', 'bg-gray-700');
                btnTransmit.classList.add('hidden');
                micPulse.classList.replace('bg-yellow-500', 'bg-green-500');
                document.getElementById('ghost-bubble').innerText = "Ouvindo...";
            }
        }

        // --- CÉREBRO DE ESCUTA (SpeechRecognition) ---
        function initSpeechRecognition() {
            if (!SpeechRecognition) {
                document.getElementById('ghost-bubble').innerText = "❌ Navegador não suporta voz.";
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                // Interceptador de Eco: Ignora entrada se a IA estiver falando
                if (isSpeaking) return; 

                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        liveTranscriptBuffer += event.results[i][0].transcript + " ";
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                const currentText = liveTranscriptBuffer + interimTranscript;
                if (currentText.trim()) {
                    document.getElementById('ghost-bubble').innerText = currentText;
                }

                // Reinicia o timer de silêncio (3.5s) se NÃO estiver pausado
                clearTimeout(silenceTimer);
                if (!isPausedLive) {
                    silenceTimer = setTimeout(() => {
                        if (liveTranscriptBuffer.trim()) {
                            processLiveInput(liveTranscriptBuffer.trim());
                            liveTranscriptBuffer = ""; // Limpa buffer
                        }
                    }, 3500); // 3.5 segundos de silêncio
                }
            };

            recognition.onerror = (event) => { console.log("Erro no Mic:", event.error); };
            recognition.onend = () => {
                // Mantém o microfone sempre escutando, a menos que o modo live seja desligado
                if (isLiveActive && !isSpeaking) recognition.start();
            };

            recognition.start();
        }

        // Função de envio manual pelo botão Transmitir
        function manualLiveSend() {
            if (liveTranscriptBuffer.trim()) {
                processLiveInput(liveTranscriptBuffer.trim());
                liveTranscriptBuffer = "";
                document.getElementById('ghost-bubble').innerText = "Enviado manual...";
            }
        }

        // Integração Multimodal e disparo para a API
        function processLiveInput(text) {
            document.getElementById('ghost-bubble').innerText = "⚙️ Processando...";
            
            // Captura um frame da webcam (Magia Multimodal)
            const video = document.getElementById('webcam-feed');
            const canvas = document.getElementById('live-canvas');
            let imagePayload = "";
            if (video.videoWidth > 0) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                imagePayload = "\n[Imagem da Câmera Capturada em Tempo Real]";
            }

            // Manda o texto pro chat normal (que aciona a IA)
            userInput.value = text + imagePayload;
            handleSend(); 
            
            // Tratamento anti-eco: O reconhecimento é desligado momentaneamente quando a IA responde (handleSend faz o botão Play ser ativado depois).
        }
    </script>
