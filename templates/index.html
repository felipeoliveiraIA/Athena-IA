<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATHENA IA - v5.2 OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Ajuste do Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #151922; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4B5563; }
        
        /* Container Oculto para o PiP */
        #live-video-container { display: none; }
    </style>
</head>
<body class="bg-[#0f1219] text-gray-200 h-screen flex overflow-hidden font-sans">

    <!-- Barra Lateral -->
    <aside class="bg-[#151922] w-72 flex flex-col h-full border-r border-gray-700 shadow-xl z-10 shrink-0">
        <div class="p-5 flex items-center gap-2 font-bold text-[#FACC15] text-2xl tracking-wide">
            🦉 ATHENA IA <span class="text-xs bg-orange-900 text-orange-200 px-2 py-0.5 rounded-full ml-1 align-middle">v5.2 OS</span>
        </div>
        
        <div class="px-4 mb-4 mt-2">
            <button onclick="openProfile()" class="w-full bg-gray-800 text-gray-300 py-2 rounded-lg hover:bg-gray-700 transition flex items-center justify-center gap-2 mb-2 text-sm border border-gray-600">
                🧠 Memória & Perfil
            </button>
            <button onclick="learnFromChat()" class="w-full bg-gray-800 text-yellow-500 py-2 rounded-lg hover:bg-gray-700 transition flex items-center justify-center gap-2 mb-3 text-xs border border-gray-600 border-dashed">
                ⚡ IA Aprender & Adicionar
            </button>
            <button onclick="startNewChat()" class="w-full bg-[#FACC15] text-black font-bold py-3 rounded-lg hover:bg-[#EAB308] transition flex items-center justify-center gap-2 shadow-lg">
                + Nova Conversa
            </button>
        </div>

        <div class="flex-1 overflow-y-auto px-4" id="chat-list">
            <!-- Lista de chats do IndexedDB renderizada aqui -->
        </div>

        <div class="p-4 border-t border-gray-700">
            <button onclick="exportBunker()" class="w-full bg-gray-800 text-gray-300 py-2 rounded-lg hover:bg-gray-700 transition flex items-center justify-center gap-2 text-sm border border-gray-600">
                📥 Backup Bunker (.json)
            </button>
        </div>
    </aside>

    <!-- Área Principal de Chat -->
    <main class="flex-1 flex flex-col h-full relative bg-[#0f1219]">
        <!-- Cabeçalho de Controles -->
        <header class="bg-[#151922] p-4 flex justify-between items-center border-b border-gray-700 shadow-sm">
            <div class="flex items-center gap-3">
                <span id="current-chat-title" class="font-semibold text-lg text-gray-100">Nova Conversa</span>
                <select id="retention-select" class="bg-gray-800 text-sm text-gray-300 rounded px-2 py-1 border border-gray-600">
                    <option value="1">Reter: 1 Mês</option>
                    <option value="3">Reter: 3 Meses</option>
                    <option value="12">Reter: 1 Ano</option>
                    <option value="999">📌 Fixar Permanentemente</option>
                </select>
            </div>
            <div class="flex items-center gap-3">
                <select id="model-select" class="bg-gray-800 text-sm text-gray-300 rounded px-3 py-2 border border-gray-600">
                    <!-- Removido V3 e ajustado Gemini para slug padrão -->
                    <option value="google/gemini-exp-1206:free">☁️ Gemini Flash (Free Estável)</option>
                    <option value="meta-llama/llama-3.2-3b-instruct:free">☁️ Llama 3.2 3B (Free Estável)</option>
                    <option value="qwen/qwen-2.5-coder-32b-instruct:free">☁️ Qwen 2.5 Coder (Free)</option>
                    <option value="deepseek/deepseek-r1:free">☁️ DeepSeek R1 (Free)</option>
                    <option value="local">💻 HD Local (LM Studio)</option>
                </select>
                <select id="voice-speed" class="bg-gray-800 text-sm text-gray-300 rounded px-2 py-2 border border-gray-600">
                    <!-- Opções de velocidade restauradas e expandidas -->
                    <option value="0.75">Voz: 0.75x</option>
                    <option value="1.0" selected>Voz: 1.0x</option>
                    <option value="1.25">Voz: 1.25x</option>
                    <option value="1.5">Voz: 1.5x</option>
                    <option value="2.0">Voz: 2.0x</option>
                    <option value="3.0">Voz: 3.0x</option>
                    <option value="4.0">Voz: 4.0x</option>
                </select>
                <button onclick="toggleLiveMode()" class="bg-[#FACC15] text-black font-bold px-4 py-2 rounded-lg hover:bg-[#EAB308] transition shadow-md flex items-center gap-2">
                    🎥 Modo Live (PiP)
                </button>
            </div>
        </header>

        <!-- Container das Mensagens -->
        <div id="chat-box" class="flex-1 overflow-y-auto p-6 flex flex-col gap-6 scroll-smooth pb-32">
            <div class="text-center text-gray-500 text-sm mt-10">
                Sistema ATHENA Iniciado. Como posso ajudar na sua arquitetura hoje?
            </div>
        </div>

        <!-- Área de Input (WhatsApp Style) -->
        <div class="absolute bottom-0 w-full bg-gradient-to-t from-[#0f1219] to-transparent pt-10 pb-6 px-6">
            <div class="max-w-4xl mx-auto relative flex items-end bg-[#151922] border border-gray-700 rounded-2xl shadow-2xl p-2">
                <input type="file" id="file-attachment" class="hidden" accept=".txt,.md,image/png,image/jpeg" onchange="processAttachment(event)">
                <button onclick="document.getElementById('file-attachment').click()" class="p-3 text-gray-400 hover:text-[#FACC15] transition shrink-0 cursor-pointer" title="Anexar Arquivo">📎</button>
                <textarea id="user-input" class="flex-1 bg-transparent text-gray-100 p-3 resize-none outline-none max-h-48 min-h-[50px] placeholder-gray-500" placeholder="Mensagem para ATHENA IA (Shift+Enter para quebrar linha)..." rows="1"></textarea>
                <button id="btn-enviar" onclick="handleSend()" class="bg-[#FACC15] text-black p-3 mb-1 mr-1 rounded-full hover:bg-[#EAB308] transition shrink-0 shadow-md">
                    <svg class="w-5 h-5 transform -rotate-45" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </div>
        </div>
    </main>

    <!-- Container do Vídeo PiP (Injetado via Document PiP) -->
    <div id="live-video-container" class="flex flex-col items-center justify-center w-full h-full p-2 bg-[#151922] text-white font-sans">
        <div class="flex items-center justify-between w-full px-2 mb-2">
            <span class="font-bold text-[#FACC15]">🦉 ATHENA Live</span>
            <div id="mic-pulse" class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></div>
        </div>
        <video id="webcam-feed" autoplay playsinline class="w-full h-auto rounded-lg shadow-lg border-2 border-gray-700 object-cover"></video>
        <div class="mt-3 w-full flex gap-2">
            <button id="btn-pause-live" class="flex-1 bg-gray-700 text-white py-2 rounded hover:bg-gray-600 text-sm font-bold">⏸ Pausar</button>
        </div>
        <div id="ghost-bubble" class="mt-2 text-xs text-gray-400 italic border-t border-gray-700 pt-2 w-full text-center min-h-[20px]">
            Ouvindo...
        </div>
    </div>

    <script>
        // --- 1. CONFIGURAÇÕES E ESTADO GLOBAL ---
        let currentChatId = Date.now().toString();
        let synth = window.speechSynthesis;
        let isSpeaking = false;
        let localStream = null;

        // Auto-redimensionamento do Textarea
        const userInput = document.getElementById('user-input');
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Shift + Enter para quebrar linha, Enter para enviar
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        // --- 2. LÓGICA DE ENVIO BLINDADA E RESPOSTA ---
        async function handleSend(textOverride = null) {
            const text = textOverride !== null ? textOverride : userInput.value;
            if (!text.trim()) return;

            if (textOverride === null) {
                userInput.value = '';
                userInput.style.height = 'auto';
            }

            const chatBox = document.getElementById('chat-box');
            
            // 1. Renderiza a mensagem do usuário (com botão de reenviar)
            renderUserMessage(text);
            
            // 2. Indicador de Processamento
            const loadingId = 'loading-' + Date.now();
            const loadingHtml = `
                <div id="${loadingId}" class="flex gap-4 max-w-3xl ml-4 mr-auto animate-pulse">
                    <div class="w-8 h-8 rounded-full bg-[#151922] border border-[#FACC15] flex items-center justify-center shrink-0">🦉</div>
                    <div class="bg-[#151922] p-4 rounded-2xl border border-gray-800 text-gray-400 text-sm italic">
                        Processando dados...
                    </div>
                </div>`;
            chatBox.insertAdjacentHTML('beforeend', loadingHtml);
            chatBox.scrollTop = chatBox.scrollHeight;

            const model = document.getElementById('model-select').value;
            const profileData = localStorage.getItem('athena_profile') || '';

            try {
                // 3. Chamada de API
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        model: model,
                        system_prompt: `Você é a ATHENA IA, v5.2 OS. Perfil do usuário: ${profileData}. Responda em Markdown estruturado.`
                    })
                });

                // 4. Remove o Processando
                document.getElementById(loadingId).remove();

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `Erro HTTP ${response.status}`);
                }

                const data = await response.json();
                
                // 5. Renderiza a IA
                renderAIMessage(data.reply);

            } catch (error) {
                if (document.getElementById(loadingId)) document.getElementById(loadingId).remove();
                renderError(error.message);
            }
        }

        // --- 3. RENDERIZAÇÃO NA TELA ---
        function renderUserMessage(text) {
            const chatBox = document.getElementById('chat-box');
            
            // Cria container
            const container = document.createElement('div');
            container.className = "flex flex-col items-end gap-1 max-w-3xl mr-4 ml-auto w-full group";
            
            // Botão de Reenviar (invisível até passar o mouse)
            const resendBtn = document.createElement('button');
            resendBtn.innerHTML = '🔄';
            resendBtn.className = "text-gray-500 hover:text-[#FACC15] text-xs opacity-0 group-hover:opacity-100 transition mr-1 cursor-pointer";
            resendBtn.title = "Reenviar esta mensagem";
            resendBtn.onclick = () => { handleSend(text); }; // Chama handleSend passando o texto antigo

            const bubble = document.createElement('div');
            bubble.className = "bg-gray-800 text-gray-100 p-4 rounded-2xl rounded-tr-sm border border-gray-700 shadow-md";
            bubble.textContent = text; // Previne XSS em input do usuário

            const row = document.createElement('div');
            row.className = "flex items-center gap-2";
            row.appendChild(resendBtn);
            row.appendChild(bubble);
            
            container.appendChild(row);
            chatBox.appendChild(container);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function renderAIMessage(markdownText) {
            const chatBox = document.getElementById('chat-box');
            const parsedHtml = marked.parse(markdownText);
            
            const aiHtml = `
                <div class="flex gap-4 max-w-4xl ml-4 mr-auto w-full">
                    <div class="w-8 h-8 rounded-full bg-[#151922] border border-[#FACC15] flex items-center justify-center shrink-0 text-sm shadow-[0_0_10px_rgba(250,204,21,0.2)]">🦉</div>
                    <div class="flex-1 space-y-2">
                        <div class="bg-[#151922] text-gray-200 p-5 rounded-2xl rounded-tl-sm border border-gray-800 shadow-lg prose prose-invert prose-yellow max-w-none">
                            ${parsedHtml}
                        </div>
                        <div class="flex gap-2">
                            <button onclick="readAloud(this, \`${encodeURIComponent(markdownText)}\`)" class="text-xs bg-gray-800 text-gray-400 px-3 py-1 rounded hover:text-white hover:bg-gray-700 transition flex items-center gap-1">
                                🔊 Ouvir
                            </button>
                            <button onclick="exportToObsidian(\`${encodeURIComponent(markdownText)}\`)" class="text-xs bg-gray-800 text-gray-400 px-3 py-1 rounded hover:text-white hover:bg-gray-700 transition flex items-center gap-1">
                                🪨 Exportar Obsidian
                            </button>
                        </div>
                    </div>
                </div>`;
                
            chatBox.insertAdjacentHTML('beforeend', aiHtml);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function renderError(errMsg) {
            const chatBox = document.getElementById('chat-box');
            const errHtml = `
                <div class="flex gap-4 max-w-3xl ml-4 mr-auto w-full">
                    <div class="w-8 h-8 rounded-full bg-red-900 border border-red-500 flex items-center justify-center shrink-0">⚠️</div>
                    <div class="bg-red-900/20 text-red-400 p-4 rounded-2xl border border-red-900 shadow-lg font-mono text-sm">
                        ${errMsg}
                    </div>
                </div>`;
            chatBox.insertAdjacentHTML('beforeend', errHtml);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // --- 4. FERRAMENTAS DE PRODUTIVIDADE (TTS, Obsidian) ---
        function readAloud(btn, encodedText) {
            const text = decodeURIComponent(encodedText);
            
            if (isSpeaking) {
                synth.cancel();
                isSpeaking = false;
                btn.innerHTML = '🔊 Ouvir';
                return;
            }

            const speed = parseFloat(document.getElementById('voice-speed').value);
            const utterance = new SpeechSynthesisUtterance(text);
            
            // Busca voz feminina
            const voices = synth.getVoices();
            const femaleVoice = voices.find(v => (v.lang.includes('pt-BR') || v.lang.includes('PT')) && (v.name.includes('Female') || v.name.includes('Luciana') || v.name.includes('Francisca'))) || voices[0];
            
            utterance.voice = femaleVoice;
            utterance.rate = speed;
            
            utterance.onstart = () => { isSpeaking = true; btn.innerHTML = '⏹️ Parar'; };
            utterance.onend = () => { isSpeaking = false; btn.innerHTML = '🔊 Ouvir'; };
            utterance.onerror = () => { isSpeaking = false; btn.innerHTML = '🔊 Ouvir'; };

            synth.speak(utterance);
        }

        function exportToObsidian(encodedText) {
            const text = decodeURIComponent(encodedText);
            const blob = new Blob([text], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ATHENA_Export_${new Date().toISOString().slice(0,10)}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }

// --- MEMÓRIA E PERFIL (100% ADITIVO) ---
        function openProfile() {
            const currentProfile = localStorage.getItem('athena_profile') || '';
            const newInformation = prompt("Centro de Memória (Arquitetura Aditiva).\nO que você deseja ADICIONAR ao seu perfil? (O histórico antigo nunca é apagado):");
            
            if (newInformation && newInformation.trim() !== "") {
                const timestamp = new Date().toLocaleDateString('pt-BR');
                const updatedProfile = currentProfile + `\n[Adicionado em ${timestamp}]: ${newInformation}`;
                localStorage.setItem('athena_profile', updatedProfile);
                alert("Memória atualizada com sucesso. A IA agora lembrará disso.");
            }
        }

        // --- APRENDIZADO AUTOMÁTICO (⚡ IA Aprender & Adicionar) ---
        function learnFromChat() {
            const chatBox = document.getElementById('chat-box');
            if (chatBox.innerText.trim() === "") return;
            
            // Simula a IA abstraindo um traço do chat atual
            alert("Avaliando o histórico desta conversa para extrair padrões...");
            const currentProfile = localStorage.getItem('athena_profile') || '';
            const timestamp = new Date().toLocaleDateString('pt-BR');
            const learnedTrait = "[Aprendizado Automático - " + timestamp + "]: O usuário prefere respostas estruturadas e análises profundas nesta sessão.";
            
            localStorage.setItem('athena_profile', currentProfile + "\n" + learnedTrait);
            alert("Novo traço adicionado ao perfil com sucesso de forma aditiva!");
        }

        // --- PROCESSAMENTO DE ANEXOS (Clip) ---
        function processAttachment(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const textContent = e.target.result;
                const userInput = document.getElementById('user-input');
                if (file.type.startsWith('text/')) {
                    userInput.value += `\n[Conteúdo do arquivo ${file.name}]:\n${textContent}\n`;
                } else {
                    alert("Aviso: Upload de imagens e PDFs complexos requerem atualização da rota /api/chat no app.py para conversão em Base64/Vision. Arquivo lido apenas no frontend por enquanto.");
                }
            };
            
            if (file.type.startsWith('text/')) {
                reader.readAsText(file);
            } else {
                reader.readAsDataURL(file); // Prepara imagem
            }
        }

        // --- GESTÃO DE SESSÕES (Nova Conversa) ---
        function startNewChat() {
            // Salva o chat atual no localStorage antes de limpar a tela (Simulação do DB local)
            const chatBox = document.getElementById('chat-box');
            const currentChatTitle = document.getElementById('current-chat-title').innerText;
            const retention = document.getElementById('retention-select').value;
            
            if (chatBox.innerHTML.trim() !== "" && !chatBox.innerHTML.includes("Sistema ATHENA Iniciado")) {
                const chatHistory = JSON.parse(localStorage.getItem('athena_chats') || '[]');
                chatHistory.push({
                    id: currentChatId,
                    title: `Chat - ${new Date().toLocaleTimeString()}`,
                    content: chatBox.innerHTML,
                    retention: retention
                });
                localStorage.setItem('athena_chats', JSON.stringify(chatHistory));
                updateChatListSidebar();
            }

            // Limpa a tela para a nova conversa
            chatBox.innerHTML = `
                <div class="text-center text-gray-500 text-sm mt-10">
                    Novo Chat Iniciado. Base de dados pronta e isolada.
                </div>`;
            currentChatId = Date.now().toString();
            document.getElementById('current-chat-title').innerText = "Nova Conversa";
        }

        // --- RENDERIZAR CHATS SALVOS NA BARRA LATERAL ---
        function updateChatListSidebar() {
            const chatListDiv = document.getElementById('chat-list');
            const chatHistory = JSON.parse(localStorage.getItem('athena_chats') || '[]');
            chatListDiv.innerHTML = '';
            
            chatHistory.reverse().forEach(chat => {
                const chatBtn = document.createElement('div');
                chatBtn.className = "p-2 mb-2 bg-gray-800 rounded text-sm text-gray-300 cursor-pointer hover:bg-gray-700 truncate border border-gray-700 flex justify-between";
                chatBtn.innerHTML = `<span>${chat.title}</span> <span title="Configuração de Retenção">${chat.retention === '999' ? '📌' : '⏳'}</span>`;
                chatBtn.onclick = () => { loadOldChat(chat); };
                chatListDiv.appendChild(chatBtn);
            });
        }

        function loadOldChat(chatObj) {
            document.getElementById('chat-box').innerHTML = chatObj.content;
            document.getElementById('current-chat-title').innerText = chatObj.title;
            currentChatId = chatObj.id;
        }

        // Inicializa a barra lateral ao carregar a página
        window.onload = () => { updateChatListSidebar(); };

        }
        
        function exportBunker() {
            alert("Módulo Bunker Backup será baixado em breve (Requer integração completa do IndexedDB na V5.3)");
        }

        // --- 5. MODO LIVE DISCRETO (Document PiP) ---
        async function toggleLiveMode() {
            if (!('documentPictureInPicture' in window)) {
                alert('Seu navegador não suporta Document PiP.');
                return;
            }

            const consent = confirm("ATHENA IA solicita acesso à Câmera e Microfone. Permitir?");
            if (!consent) return;

            try {
                // ABRE DISCRETO NO CANTO SUPERIOR DIREITO
                const pipWindow = await window.documentPictureInPicture.requestWindow({
                    width: 300,
                    height: 400
                });

                const container = document.getElementById('live-video-container');
                container.style.display = 'flex';
                pipWindow.document.body.appendChild(container);
                pipWindow.document.body.style.margin = '0';
                pipWindow.document.body.style.background = '#151922';

                // Inicia WebCam
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                const videoElement = pipWindow.document.getElementById('webcam-feed');
                videoElement.srcObject = localStream;

                pipWindow.addEventListener("pagehide", () => {
                    document.body.appendChild(container); // Devolve pro DOM
                    container.style.display = 'none';
                    if (localStream) {
                        localStream.getTracks().forEach(t => t.stop());
                    }
                });

            } catch (err) {
                console.error(err);
                alert("Erro ao iniciar Live: " + err.message);
            }
        }
    </script>
</body>
</html>
