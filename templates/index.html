            <!-- NOVA FUNCIONALIDADE: Barra de Pesquisa de Chats -->

        <div class="flex-1 overflow-y-auto px-4" id="chat-list">

    <!-- Área Principal de Chat -->

     <!-- Container das Mensagens (Unificado e Protegido) -->

        <!-- Área de Input Híbrida (Estilo Gemini) -->

            <div id="drop-zone" class="max-w-4xl mx-auto relative flex flex-col bg-[#111111] border border-gray-700 rounded-2xl shadow-2xl transition-colors duration-200">
                
                <!-- Container para as Miniaturas dos Arquivos -->
                <div id="attachments-preview" class="flex flex-wrap gap-2 px-3 pt-2 hidden max-h-32 overflow-y-auto"></div>

                <div class="flex items-end p-2 w-full">

                    <textarea id="user-input" class="flex-1 bg-transparent text-gray-100 p-3 resize-none outline-none max-h-[150px] min-h-[50px] overflow-y-auto placeholder-gray-500 text-sm sm:text-base" placeholder="Arraste arquivos ou digite (Shift+Enter quebra linha)..." rows="1"></textarea>
                    
                    <!-- Botão de Microfone -->
                    <button id="btn-dictation" onclick="toggleDictation()" class="p-3 text-gray-400 hover:text-[#FACC15] transition shrink-0 cursor-pointer flex items-center justify-center" title="Gravar Áudio (Voz para Texto)">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                    </button>
                    
                    <!-- Botão Enviar -->
                    <button id="btn-enviar" onclick="handleSend()" class="bg-[#FACC15] text-black p-3 mb-1 mr-1 rounded-full hover:bg-[#EAB308] transition shrink-0 shadow-md flex items-center justify-center w-10 h-10 sm:w-12 sm:h-12 disabled:opacity-50">
                        <svg class="w-5 h-5 sm:w-6 sm:h-6 sm:ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                    </button>

            <div class="max-w-4xl mx-auto text-center mt-2 text-[10px] text-gray-600">ATHENA IA v5.2 OS pode cometer erros. Considere verificar informações vitais.</div>
        </div>

    <!-- Container do Vídeo PiP (Injetado via Document PiP) -->
   <!-- Container do Vídeo Flutuante Interno e PiP Híbrido -->
    <div id="live-video-container" class="absolute top-20 right-6 w-72 bg-[#111111] border border-gray-600 rounded-xl shadow-2xl z-50 flex-col overflow-hidden hidden">
        <!-- Barra de Título Arrastável -->
        <div id="live-header" class="flex items-center justify-between w-full px-3 py-2 bg-gray-800 border-b border-gray-700 cursor-move">
            <span class="font-bold text-[#FACC15] text-sm">🦉 ATHENA Live</span>
            <div class="flex items-center gap-2">
                <div id="mic-pulse" class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></div>
                <button onclick="detachPiP()" title="Desafixar sobre o Windows" class="text-gray-400 hover:text-white text-xs">⧉</button>
                <button onclick="toggleLiveMode()" class="text-gray-400 hover:text-red-500 text-xs font-bold">✕</button>
            </div>
        </div>
        <!-- Vídeo ajustado para não cortar o rosto (object-contain) -->
        <video id="webcam-feed" autoplay playsinline muted class="w-full h-48 object-contain bg-black"></video>
        <!-- Canvas invisível para capturar foto multimodal -->
        <canvas id="live-canvas" class="hidden"></canvas>
        
        <div class="p-3 w-full flex flex-col gap-2 border-t border-gray-700 bg-[#050505]">
            <div class="flex gap-2">
                <button id="btn-pause-live" onclick="togglePauseLive()" class="flex-1 bg-gray-700 text-white py-1.5 rounded hover:bg-gray-600 text-xs font-bold transition">⏸ Pausar IA</button>
                <button id="btn-transmit-live" onclick="manualLiveSend()" class="flex-1 bg-[#FACC15] text-black py-1.5 rounded hover:bg-[#EAB308] text-xs font-bold transition hidden">▶ Transmitir</button>
            </div>
            <div id="ghost-bubble" class="text-[11px] text-gray-400 italic text-center min-h-[16px] overflow-hidden whitespace-nowrap text-ellipsis border border-dashed border-gray-600 rounded p-1">Aguardando voz...</div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURAÇÕES E ESTADO GLOBAL ---
        let currentChatId = Date.now().toString();
        let synth = window.speechSynthesis;
        let isSpeaking = false;
        let localStream = null;

        // Auto-redimensionamento do Textarea
        const userInput = document.getElementById('user-input');
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Shift + Enter para quebrar linha, Enter para enviar
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        // --- SUPORTE PARA COLAR IMAGENS (CTRL+V) ---
        userInput.addEventListener('paste', function(e) {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    const file = item.getAsFile();
                    processFileLogic(file);
                }
            }
        });

        // --- PROCESSAMENTO DE ANEXOS (Clip e Ctrl+V unificados) ---
        function processAttachment(event) {
            const file = event.target.files[0];
            if (!file) return;
            processFileLogic(file);
        }

        function processFileLogic(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                if (file.type.startsWith('text/')) {
                    userInput.value += `\n[Conteúdo do arquivo ${file.name}]:\n${content}\n`;
                } else if (file.type.startsWith('image/')) {
                    // Prepara a interface para exibir que a imagem foi anexada
                    userInput.value += `\n[Imagem Anexada: ${file.name}]\n`;
                    alert("Imagem anexada com sucesso no frontend! (Lembre-se: Para a IA ler a imagem, o modelo multivisão precisa estar ativo e o backend configurado para base64).");
                }
                userInput.style.height = 'auto';
                userInput.style.height = (userInput.scrollHeight) + 'px';
            };
            
            if (file.type.startsWith('text/')) {
                reader.readAsText(file);
            } else {
                reader.readAsDataURL(file);
            }
        }

        // --- 2. LÓGICA DE ENVIO BLINDADA E RESPOSTA ---
        // --- MELHORIA PROATIVA: Salvar rascunho enquanto digita ---
        userInput.addEventListener('input', function() {
            localStorage.setItem('athena_draft', this.value);
        });
        window.addEventListener('DOMContentLoaded', () => { 
            const draft = localStorage.getItem('athena_draft');
            if(draft) userInput.value = draft;
            updateChatListSidebar(); 
        });

        // --- NOVA FUNÇÃO ADICIONADA: renderUserMessage ---
        
        // --- NOVA FUNÇÃO: renderUserMessage COM EDIÇÃO ---
        function renderUserMessage(text, messageId = null) {
            const chatBox = document.getElementById('chat-box');
            // Gera um ID único se não for fornecido
            const id = messageId || 'user-msg-' + Date.now(); 

            const userHtml = `
                <div id="${id}-container" class="flex gap-4 max-w-4xl mr-4 ml-auto w-full group justify-end">
                    <div class="flex-1 flex flex-col items-end space-y-1 overflow-hidden">
                        <div id="${id}-text" class="bg-[#1a1a1a] text-gray-200 p-3 rounded-2xl rounded-tr-sm border border-gray-700 shadow-md inline-block whitespace-pre-wrap break-words text-left w-full max-w-full">
                            ${text}
                        </div>
                        <div class="opacity-0 group-hover:opacity-100 transition-opacity flex gap-3">
                            <button onclick="editUserMessage('${id}')" class="text-xs text-gray-500 hover:text-[#FACC15] transition flex items-center gap-1" title="Editar Mensagem">✏️ Editar</button>
                            <button onclick="handleSend(document.getElementById('${id}-text').innerText)" class="text-xs text-gray-500 hover:text-[#FACC15] transition flex items-center gap-1" title="Reenviar Mensagem">🔄 Reenviar</button>
                        </div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-gray-800 border border-gray-600 flex items-center justify-center shrink-0 text-sm shadow-md">👤</div>
                </div>`;
            chatBox.insertAdjacentHTML('beforeend', userHtml);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // --- LÓGICA DE EDIÇÃO DE MENSAGENS ---
        function editUserMessage(id) {
            const textDiv = document.getElementById(`${id}-text`);
            const currentText = textDiv.innerText;
    
            // Transforma a div em um textarea editável
            textDiv.innerHTML = `
                <textarea id="${id}-edit-input" class="w-full bg-[#050505] text-gray-200 p-2 rounded border border-[#FACC15] outline-none resize-none min-h-[80px] shadow-inner">${currentText}</textarea>
                <div class="flex justify-end gap-2 mt-2">
                    <button onclick="cancelEdit('${id}', \`${currentText.replace(/`/g, '\\`')}\`)" class="text-xs bg-gray-700 text-white px-3 py-1.5 rounded hover:bg-gray-600 transition">Cancelar</button>
                    <button onclick="saveEdit('${id}')" class="text-xs bg-[#FACC15] text-black px-3 py-1.5 rounded font-bold hover:bg-[#EAB308] transition">💾 Salvar & Reenviar</button>
                </div>
            `;
        }

        function cancelEdit(id, originalText) {
            document.getElementById(`${id}-text`).innerText = originalText;
        }

        function saveEdit(id) {
            const newText = document.getElementById(`${id}-edit-input`).value;
            if (!newText.trim()) return;
    
            // Atualiza o texto na interface
            document.getElementById(`${id}-text`).innerText = newText;
    
            // Força o salvamento na memória do IndexedDB/LocalStorage
            saveCurrentChat(); 
    
            // Dispara a nova requisição para a IA com o texto editado
            handleSend(newText); 
        }
        
        // --- 2. LÓGICA DE ENVIO (Com Streaming de Tokens) ---
        async function handleSend(textOverride = null) {
            const text = textOverride !== null ? textOverride : userInput.value;
            if (!text.trim()) return;

            if (textOverride === null) {
                userInput.value = '';
                localStorage.removeItem('athena_draft'); // Limpa rascunho após enviar
                userInput.style.height = 'auto';
            }

            const chatBox = document.getElementById('chat-box');
            renderUserMessage(text);
            
            const model = document.getElementById('model-select').value;
            const profileData = localStorage.getItem('athena_profile') || '';

            // Estrutura inicial do balão da IA (vazio para receber o streaming)
            const uniqueId = 'ai-msg-' + Date.now();
            const aiHtml = `
                <div class="flex gap-4 max-w-4xl ml-4 mr-auto w-full group">
                    <div class="w-8 h-8 rounded-full bg-[#111111] border border-[#FACC15] flex items-center justify-center shrink-0 text-sm shadow-[0_0_10px_rgba(250,204,21,0.2)]">🦉</div>
                    <div class="flex-1 space-y-2 overflow-hidden">
                        <div id="${uniqueId}" class="markdown-body text-gray-200">
                            <span class="animate-pulse text-gray-500 italic">Conectando...</span>
                        </div>
                        <div class="flex gap-2 mt-3 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="readAloud(this, '${uniqueId}')" class="text-xs bg-gray-800 text-gray-400 px-3 py-1 rounded hover:text-white hover:bg-gray-700 transition flex items-center gap-1">🔊 Ouvir</button>
                            <button onclick="copyToClipboard('${uniqueId}')" class="text-xs bg-gray-800 text-gray-400 px-3 py-1 rounded hover:text-white hover:bg-[#FACC15] hover:text-black transition flex items-center gap-1 border border-gray-700">📋 Copiar</button>
                            <button onclick="exportToObsidian('${uniqueId}')" class="text-xs bg-gray-800 text-gray-400 px-3 py-1 rounded hover:text-white hover:bg-gray-700 transition flex items-center gap-1">🪨 Exportar Obsidian</button>
                        </div>
                    </div>
                </div>`;
            chatBox.insertAdjacentHTML('beforeend', aiHtml);
            chatBox.scrollTop = chatBox.scrollHeight;

           const textContainer = document.getElementById(uniqueId);
           let accumulatedText = "";

           try {
               // Prepara os textos dos arquivos .txt inseridos
               let attachedText = "";
               const imagePayloads = [];

               globalAttachments.forEach(f => {
                   if (f.type.startsWith('text/')) {
                       attachedText += `\n[Conteúdo Anexado: ${f.name}]:\n${f.data}`;
                   } else if (f.type.startsWith('image/')) {
                       imagePayloads.push(f.data);
                   }
               });

               const finalMessage = text + attachedText;
               
               let response;
               const systemPromptAthena = `Você é a ATHENA IA, v5.2 OS. Perfil do usuário: ${profileData}. Responda em Markdown estruturado (ideal para exportação Obsidian). Você atua como uma engenheira de software autônoma. Se o usuário pedir para criar projetos, sites, pastas ou arquivos locais, você DEVE gerar estritamente um bloco JSON escondido nesta estrutura exata: \`\`\`json\n{"athena_action": "create_file", "path": "nome_do_arquivo.extensao", "content": "codigo completo aqui"}\n\`\`\`. Ações permitidas: create_file, create_folder, run_cmd.`;

               // 1. DESVIO DE ARQUITETURA: Conexão Direta do Navegador para o LM Studio (Bypass Nuvem)
               if (model === 'local') {
                   // CORREÇÃO ATHENA: Revertido para 127.0.0.1. O navegador bloqueia chamadas mistas (HTTPS para HTTP) para "localhost", mas possui uma exceção de segurança para o IP "127.0.0.1". O modo 'cors' foi forçado.
                   response = await fetch('http://127.0.0.1:1234/v1/chat/completions', {
                       method: 'POST',
                       mode: 'cors', 
                       headers: { 'Content-Type': 'application/json' },
                       body: JSON.stringify({
                           model: "local-model",
                           messages: [
                               { role: "system", content: systemPromptAthena },
                               { role: "user", content: finalMessage }
                           ],
                           temperature: 0.7,
                           max_tokens: 2000,
                           stream: true
                       })
                   });
               }

                if (textOverride === null) {
                    globalAttachments = [];
                    renderThumbnails();
                }

                if (!response.ok) {
                    let errorMsg = `Erro HTTP ${response.status}`;
                    try { const errorData = await response.json(); errorMsg = errorData.error || errorMsg; } catch(e) {}
                    throw new Error(`Conexão Recusada: ${errorMsg}\n\n 🛑 SOLUÇÃO: Se estiver usando o 'HD Local', abra o LM Studio > Server (Porta 1234) e certifique-se de que a opção 'CORS' (Cross-Origin Resource Sharing) esteja ATIVADA nas configurações do servidor local para que seu navegador permita o acesso.`);
                }

                marked.setOptions({ breaks: true, gfm: true });
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let sseBuffer = '';

                // 2. PARSER HÍBRIDO (Decodifica Texto da Nuvem e SSE do LM Studio)
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunkStr = decoder.decode(value, { stream: true });
                    
                    if (model === 'local') {
                        sseBuffer += chunkStr;
                        const lines = sseBuffer.split('\n');
                        sseBuffer = lines.pop(); // Guarda pedaços incompletos para a próxima iteração
                        
                        for (const line of lines) {
                            // CORREÇÃO APLICADA: Limpeza extra de espaços em branco (trim) para garantir que o prefixo 'data:' seja lido perfeitamente
                            const trimmedLine = line.trim();
                            if (trimmedLine.startsWith('data:') && !trimmedLine.includes('[DONE]')) {
                                try {
                                    // Isola o JSON de forma robusta e segura
                                    const jsonStr = trimmedLine.replace(/^data:\s*/, '').trim();
                                    if(jsonStr) {
                                        const parsed = JSON.parse(jsonStr);
                                        const token = parsed.choices[0].delta?.content || '';
                                        accumulatedText += token;
                                    }
                                } catch(e) {
                                    console.log("Aguardando próximo chunk válido do LM Studio...");
                                }
                            }
                        }
                    } else {
                        accumulatedText += chunkStr;
                    }
                    
                    textContainer.innerHTML = marked.parse(accumulatedText);
                    chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
                }
                
                textContainer.setAttribute('data-raw-markdown', encodeURIComponent(accumulatedText));

                // --- MOTOR DE AGENTE AUTÔNOMO ATHENA (BLINDADO) ---
                const automacaoMatch = accumulatedText.match(/```json\s*\n\s*\{\s*"athena_action":/i);
                if (automacaoMatch) {
                    try {
                        const jsonString = accumulatedText.substring(accumulatedText.indexOf('{', automacaoMatch.index), accumulatedText.lastIndexOf('}') + 1);
                        const comando = JSON.parse(jsonString);
                        
                        if(comando.athena_action) {
                            renderError(`⚙️ Agente Local acionado. Processando ação autônoma: ${comando.athena_action}...`);
                            fetch('[http://127.0.0.1:8000/execute](http://127.0.0.1:8000/execute)', {
                                method: 'POST',
                                headers: { 
                                    'Content-Type': 'application/json',
                                    'Authorization': 'Bearer athena-chv-segura-5.2' 
                                },
                                body: JSON.stringify({ action: comando.athena_action, path: comando.path, content: comando.content || '' })
                            }).then(res => res.json()).then(data => {
                                if(data.status === "sucesso") {
                                    renderError(`✅ Ação Concluída no Sandbox: ${data.mensagem}`);
                                } else {
                                    renderError(`⛔ Bloqueio de Segurança pelo Agente: ${data.mensagem}`);
                                }
                            }).catch(err => {
                                renderError(`🔌 O Agente Local (Porta 8000) está desligado ou o navegador bloqueou a conexão.`);
                            });
                        }
                    } catch(e) {
                        console.log("Falha ao parsear ação autônoma da IA", e);
                    }
                }
                // --- FIM DO MOTOR DE AGENTE AUTÔNOMO ---
               
                saveCurrentChat();

            } catch (error) {
                // CORREÇÃO APLICADA: Tratamento inteligente do objeto de erro para impedir que a tela mostre '[object Object]'
                const errorDetails = (!error.message || error.message.includes("[object Object]")) 
                    ? "Conexão Recusada. O navegador bloqueou o acesso ao localhost por questões de segurança (CORS)." 
                    : error.message;

                textContainer.innerHTML = `

                    <span class="text-gray-400 text-xs">🛑 SOLUÇÃO APLICADA: Tentando usar o HD Local através do site online (Render)? Para que o modo 'HD Local' funcione 100% sem bloqueios do navegador, abra o arquivo <b>index.html</b> diretamente no seu computador ou rode o Flask local (http://localhost:10000).</span>`;
                
                // INJEÇÃO AQUI: Salva no histórico mesmo se der erro, para não perder seu prompt

            }

        function saveCurrentChat() {
            const chatBox = document.getElementById('chat-box');
            // Proteção: Não salvar se a tela for apenas a mensagem inicial do sistema vazia
            if (chatBox.innerHTML.includes("Sistema ATHENA Iniciado") && chatBox.children.length === 1) return;
            
            let chatHistory = JSON.parse(localStorage.getItem('athena_chats') || '[]');
            let existingChatIndex = chatHistory.findIndex(c => c.id === currentChatId);
            
            const currentTitle = document.getElementById('current-chat-title').innerText;
            const retention = document.getElementById('retention-select').value;
            
            let needsSidebarUpdate = false;

            if (existingChatIndex !== -1) {
                // Atualiza em tempo real o chat existente
                if (chatHistory[existingChatIndex].title !== currentTitle) needsSidebarUpdate = true;
                chatHistory[existingChatIndex].content = chatBox.innerHTML;
                chatHistory[existingChatIndex].title = currentTitle;
                chatHistory[existingChatIndex].retention = retention;
            } else {
                // Se não existir, cria um novo registro
                chatHistory.push({
                    id: currentChatId,
                    title: currentTitle !== "Nova Conversa" ? currentTitle : `Chat - ${new Date().toLocaleTimeString()}`,
                    content: chatBox.innerHTML,
                    retention: retention
                });
                document.getElementById('current-chat-title').innerText = chatHistory[chatHistory.length - 1].title;
                needsSidebarUpdate = true;
            }
            
            localStorage.setItem('athena_chats', JSON.stringify(chatHistory));
            
            // CORREÇÃO: Força a atualização da barra esquerda se o nome mudou ou um chat novo surgiu
            if (needsSidebarUpdate) {
                updateChatListSidebar();
            }
        }

        // --- 6. MODO LIVE: MOTOR MULTIMODAL (Voz + Visão + Janela Híbrida) ---
        let isLiveActive = false;
        // let localStream = null; <- REMOVIDO: ESTAVA DUPLICADO E CAUSANDO O APAGÃO DO SISTEMA
        let pipWindowRef = null;
        
        // Variáveis do Motor de Voz
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let silenceTimer = null;
        let isPausedLive = false;
        let liveTranscriptBuffer = "";

        // Funcionalidade de Arrastar a Janela (Drag and Drop interno)
        const liveContainer = document.getElementById('live-video-container');
        const liveHeader = document.getElementById('live-header');
        let isDragging = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;

        liveHeader.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', dragEnd);

        function dragStart(e) {
            initialX = e.clientX - xOffset;
            initialY = e.clientY - yOffset;
            if (e.target === liveHeader || e.target.parentElement === liveHeader) isDragging = true;
        }
        function drag(e) {
            if (isDragging) {
                e.preventDefault();
                currentX = e.clientX - initialX;
                currentY = e.clientY - initialY;
                xOffset = currentX;
                yOffset = currentY;
                liveContainer.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            }
        }
        function dragEnd() { isDragging = false; }

        // Inicialização do Modo Live
        async function toggleLiveMode() {
            const container = document.getElementById('live-video-container');
            const videoElement = document.getElementById('webcam-feed');

            if (isLiveActive) {
                stopLiveMode();
                return;
            }

            const consent = confirm("ATHENA IA solicita acesso à Câmera e Microfone com cancelamento de eco. Permitir?");
            if (!consent) return;

            try {
                // Liga o Hardware
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 320 }, 
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
                });
                
                videoElement.srcObject = localStream;
                container.style.display = 'flex';
                isLiveActive = true;
                
                // Reset de posições
                xOffset = 0; yOffset = 0;
                container.style.transform = `translate3d(0px, 0px, 0)`;

                initSpeechRecognition();

            } catch (err) {
                alert("Erro ao iniciar Live: " + err.message);
                stopLiveMode();
            }
        }

        function stopLiveMode() {
            isLiveActive = false;
            document.getElementById('live-video-container').style.display = 'none';
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (recognition) recognition.stop();
            if (pipWindowRef) pipWindowRef.close();
            clearTimeout(silenceTimer);
            document.getElementById('ghost-bubble').innerText = "Aguardando voz...";
        }

        // --- CÉREBRO DE ESCUTA (SpeechRecognition) ---
        function initSpeechRecognition() {
            if (!SpeechRecognition) {
                document.getElementById('ghost-bubble').innerText = "❌ Navegador não suporta voz.";
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                // Interceptador de Eco: Ignora entrada se a IA estiver falando
                if (isSpeaking) return; 

                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        liveTranscriptBuffer += event.results[i][0].transcript + " ";
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                const currentText = liveTranscriptBuffer + interimTranscript;
                if (currentText.trim()) {
                    document.getElementById('ghost-bubble').innerText = currentText;
                }

                // Reinicia o timer de silêncio (3.5s) se NÃO estiver pausado
                clearTimeout(silenceTimer);
                if (!isPausedLive) {
                    silenceTimer = setTimeout(() => {
                        if (liveTranscriptBuffer.trim()) {
                            processLiveInput(liveTranscriptBuffer.trim());
                            liveTranscriptBuffer = ""; // Limpa buffer
                        }
                    }, 3500); // 3.5 segundos de silêncio
                }
            };

            recognition.onerror = (event) => { console.log("Erro no Mic:", event.error); };
            recognition.onend = () => {
                // Mantém o microfone sempre escutando, a menos que o modo live seja desligado
                if (isLiveActive && !isSpeaking) recognition.start();
            };

            recognition.start();
        }

        // Função de envio manual pelo botão Transmitir
        function manualLiveSend() {
            if (liveTranscriptBuffer.trim()) {
                processLiveInput(liveTranscriptBuffer.trim());
                liveTranscriptBuffer = "";
                document.getElementById('ghost-bubble').innerText = "Enviado manual...";
            }
        }

        // Integração Multimodal e disparo para a API
        function processLiveInput(text) {
            document.getElementById('ghost-bubble').innerText = "⚙️ Processando...";
            
            // Captura um frame da webcam (Magia Multimodal)
            const video = document.getElementById('webcam-feed');
            const canvas = document.getElementById('live-canvas');
            let imagePayload = "";
            if (video.videoWidth > 0) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                imagePayload = "\n[Imagem da Câmera Capturada em Tempo Real]";
            }

            // Manda o texto pro chat normal (que aciona a IA)
            userInput.value = text + imagePayload;
            handleSend(); 
            
            // Tratamento anti-eco: O reconhecimento é desligado momentaneamente quando a IA responde (handleSend faz o botão Play ser ativado depois).
        }

        // --- 7. MÓDULOS DE APRIMORAMENTO GEMINI-LIKE ---

        // Responsividade Mobile
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        // Pesquisa de Conversas na Barra Lateral
        function filterChats() {
            const query = document.getElementById('search-chats').value.toLowerCase();
            const chats = document.getElementById('chat-list').children;
            for (let i = 0; i < chats.length; i++) {
                const title = chats[i].querySelector('span').innerText.toLowerCase();
                chats[i].style.display = title.includes(query) ? 'flex' : 'none';
            }
        }

        // Gestão de Múltiplos Anexos Visuais (Até 50 Arquivos)
        let globalAttachments = [];
        const previewContainer = document.getElementById('attachments-preview');
        const dropZone = document.getElementById('drop-zone');

        // Drag and Drop (Arrastar e Soltar)
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-[#FACC15]', 'bg-gray-800'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('border-[#FACC15]', 'bg-gray-800'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-[#FACC15]', 'bg-gray-800');
            handleNewFiles(e.dataTransfer.files);
        });

        // Modificando a função existente de Attachments
        window.processAttachment = function(event) { handleNewFiles(event.target.files); };
        window.processFileLogic = function(file) { handleNewFiles([file]); };

        function handleNewFiles(files) {
            if (globalAttachments.length + files.length > 50) {
                alert("Limite máximo de 50 arquivos atingido.");
                return;
            }
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    globalAttachments.push({ name: file.name, type: file.type, data: e.target.result });
                    renderThumbnails();
                };
                file.type.startsWith('text/') ? reader.readAsText(file) : reader.readAsDataURL(file);
            });
        }

        function renderThumbnails() {
            previewContainer.innerHTML = '';
            previewContainer.classList.toggle('hidden', globalAttachments.length === 0);
            
            globalAttachments.forEach((file, index) => {
                const isImage = file.type.startsWith('image/');
                const previewHtml = isImage 
                    ? `<img src="${file.data}" class="w-10 h-10 object-cover rounded-md border border-gray-600">`
                    : `<div class="w-10 h-10 bg-gray-800 rounded-md border border-gray-600 flex items-center justify-center text-xs text-[#FACC15]">📄</div>`;
                
                previewContainer.insertAdjacentHTML('beforeend', `
                    <div class="relative group mt-1">
                        ${previewHtml}
                        <button onclick="removeAttachment(${index})" class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px] opacity-0 group-hover:opacity-100 transition shadow-md">✕</button>
                        <div class="text-[9px] text-gray-400 w-10 truncate text-center mt-1">${file.name}</div>
                    </div>
                `);
            });
            document.getElementById('file-attachment').value = '';
        }

        function removeAttachment(index) {
            globalAttachments.splice(index, 1);
            renderThumbnails();
        }

        // Voz para Texto (Microfone no Input)
        let dictationRec = null;
        let isDictating = false;

        function toggleDictation() {
            const btn = document.getElementById('btn-dictation');
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert("Seu navegador não suporta gravação de voz."); return; }

            if (isDictating) {
                dictationRec.stop();
                return;
            }

            dictationRec = new SpeechRecognition();
            dictationRec.lang = 'pt-BR';
            dictationRec.continuous = true;
            dictationRec.interimResults = true;
            
            let finalTranscript = userInput.value;

            dictationRec.onstart = () => {
                isDictating = true;
                btn.classList.add('text-red-500', 'animate-pulse');
                userInput.placeholder = "Escutando... (Fale agora)";
            };

            dictationRec.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript + " ";
                    else interim += event.results[i][0].transcript;
                }
                userInput.value = finalTranscript + interim;
                userInput.style.height = 'auto';
                userInput.style.height = (userInput.scrollHeight) + 'px';
            };

            dictationRec.onend = () => {
                isDictating = false;
                btn.classList.remove('text-red-500', 'animate-pulse');
                userInput.placeholder = "Mensagem para ATHENA IA (Shift+Enter quebra linha)...";
            };

            dictationRec.start();
        }
        
    </script>
</body>
</html>
