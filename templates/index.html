<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.T.H.E.N.A. OS v5.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { background-color: #0d0d0f; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { background-color: #080809; border-right: 1px solid #1f1f22; }
        .chat-container { height: calc(100vh - 160px); overflow-y: auto; scroll-behavior: smooth; }
        .msg-user { background-color: #ff9800; color: #000; text-align: left; margin-left: auto; max-width: 80%; border-radius: 8px; font-weight: 500; }
        .msg-ia-container { max-width: 85%; }
        .msg-ia { background-color: #1a1a1d; color: #d1d5db; border-radius: 8px; border-left: 2px solid #ff9800; }
        .msg-ia p { margin-bottom: 0.75rem; line-height: 1.6; }
        .msg-ia ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 0.75rem; }
        .msg-ia strong { color: #ffb74d; }
        .btn-action { color: #6b7280; font-size: 0.85rem; cursor: pointer; transition: color 0.2s; display: inline-flex; align-items: center; gap: 0.25rem; }
        .btn-action:hover { color: #ff9800; }
        .input-bg { background-color: #1a1a1d; border: 1px solid #2a2a2d; }
        /* Scrollbar customizada */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0d0d0f; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff9800; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- BARRA LATERAL (IDÊNTICA AO PRINT 1) -->
    <aside class="w-64 sidebar flex flex-col p-5">
        <h1 class="text-2xl font-black text-white mb-6 flex items-center gap-2">
            <span class="text-orange-500">⚡</span> A.T.H.E.N.A. <span class="bg-orange-500 text-black text-xs px-2 py-0.5 rounded font-bold ml-1">v5.2</span>
        </h1>
        
        <button onclick="location.reload()" class="w-full bg-orange-500 hover:bg-orange-600 text-black font-bold py-2.5 px-4 rounded-lg mb-8 transition-colors flex justify-center items-center gap-2">
            + Nova Sessão
        </button>

        <div class="text-gray-400 text-xs uppercase tracking-wider mb-3">Integrações:</div>
        <label class="flex items-center gap-2 cursor-pointer text-gray-300 hover:text-white">
            <input type="checkbox" id="medical-mode" class="form-checkbox w-4 h-4 text-orange-500 rounded bg-gray-800 border-gray-600 focus:ring-orange-500 focus:ring-offset-gray-900">
            <span class="text-sm">🩺 Modo Semiológico</span>
        </label>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 flex flex-col relative">
        
        <!-- CABEÇALHO SUPERIOR (IDÊNTICO AO PRINT 1) -->
        <header class="p-4 border-b border-[#1f1f22] bg-[#0d0d0f] flex justify-between items-center">
            <!-- Modelos Atualizados para Evitar Erro 404 -->
            <select id="model-select" class="bg-white text-black text-sm font-semibold p-2 rounded outline-none w-72 shadow-sm cursor-pointer">
                <option value="qwen/qwen-2.5-coder-32b-instruct">🧠 Nuvem (Qwen Coder 32B)</option>
                <option value="google/gemini-2.0-flash-lite-preview-02-05:free">🧠 Nuvem (Gemini 2.0 Flash Lite - Free)</option>
                <option value="meta-llama/llama-3-8b-instruct:free">🧠 Nuvem (Llama 3 8B - Free)</option>
                <option value="local-hd">🖥️ HD Local (LM Studio porta 1234)</option>
            </select>

            <div class="flex items-center gap-3 text-sm font-medium">
                <select class="bg-[#1a1a1d] text-white p-1.5 px-3 rounded border border-[#2a2a2d] outline-none"><option>1.0x</option></select>
                <button class="bg-[#1a1a1d] hover:bg-[#2a2a2d] text-white p-1.5 px-3 rounded border border-[#2a2a2d] flex gap-2 items-center">
                    🎤 Live
                </button>
                <button class="bg-[#1a1a1d] hover:bg-red-900 text-red-500 p-1.5 px-3 rounded border border-[#2a2a2d]">🔴</button>
                <button class="bg-[#1a1a1d] hover:bg-[#2a2a2d] text-white p-1.5 px-3 rounded border border-[#2a2a2d]">PiP</button>
            </div>
        </header>

        <!-- CAIXA DE CHAT -->
        <div id="chat-box" class="chat-container p-6 flex flex-col gap-6">
            <div class="msg-ia-container">
                <div class="msg-ia p-4 text-sm">
                    🦉 Athena OS iniciada. Todos os sistemas otimizados. Pronta para os seus projetos.
                </div>
                <div class="flex gap-4 mt-2 ml-1">
                    <span class="btn-action">🔊 Ouvir</span>
                    <span class="btn-action">💎 Salvar no Obsidian</span>
                </div>
            </div>
        </div>

        <!-- INDICADOR DE DIGITAÇÃO -->
        <div id="typing-indicator" class="hidden absolute bottom-24 left-6 text-orange-500 text-sm italic font-medium">
            <span class="animate-pulse">Athena processando...</span>
        </div>

        <!-- ÁREA DE INPUT DE MENSAGEM -->
        <div class="p-4 bg-[#0d0d0f] border-t border-[#1f1f22]">
            <div class="input-bg flex items-center p-1.5 rounded-xl focus-within:border-orange-500 transition-colors">
                
                <label for="image-upload" class="cursor-pointer p-2 px-3 text-gray-400 hover:text-orange-500 transition-colors text-lg" title="Anexar Imagem">
                    📁
                </label>
                <input type="file" id="image-upload" accept="image/*" class="hidden" onchange="previewImage()">
                
                <input type="text" id="chat-input" class="flex-1 bg-transparent text-gray-200 p-2 focus:outline-none text-sm" 
                       placeholder="Mensagem (Shift+Enter para pular linha)..." 
                       onkeypress="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }">
                
                <button onclick="sendMessage()" class="bg-orange-500 hover:bg-orange-600 text-black p-2.5 px-4 rounded-lg flex items-center gap-2 font-bold ml-2 transition-colors">
                    Enviar <span class="bg-white rounded-full p-0.5 text-xs">🧠</span>
                </button>
            </div>
            <div id="image-preview" class="hidden mt-2 text-xs text-orange-400 pl-4">
                🖼️ Imagem carregada. Pronta para o envio.
            </div>
        </div>
    </main>

    <script>
        let currentImageBase64 = null;

        function previewImage() {
            const file = document.getElementById('image-upload').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = () => { 
                    currentImageBase64 = reader.result; 
                    document.getElementById('image-preview').classList.remove('hidden'); 
                };
                reader.readAsDataURL(file);
            }
        }

        function salvarNoObsidian(textoCru) {
            const blob = new Blob([textoCru], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const data = new Date().toISOString().split('T')[0];
            a.download = `Athena_Nota_${data}.md`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function ouvirTexto(textoCru) {
            const textoLimpo = textoCru.replace(/[#*`_]/g, ''); 
            const utterance = new SpeechSynthesisUtterance(textoLimpo);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.1;
            speechSynthesis.speak(utterance);
        }

        async function sendMessage() {
            const inputField = document.getElementById('chat-input');
            const message = inputField.value.trim();
            const modelSelect = document.getElementById('model-select').value;
            const medicalMode = document.getElementById('medical-mode').checked;
            
            if (!message && !currentImageBase64) return;

            let displayMsg = message;
            if (currentImageBase64) displayMsg += '<br><span class="text-xs text-black/70 mt-1 block">🖼️ [Imagem Anexada]</span>';
            
            appendUserMessage(displayMsg);
            
            inputField.value = '';
            document.getElementById('image-preview').classList.add('hidden');
            document.getElementById('typing-indicator').classList.remove('hidden');

            const payload = { message: message, model: modelSelect, medical_mode: medicalMode, image: currentImageBase64 };
            currentImageBase64 = null;
            document.getElementById('image-upload').value = '';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                document.getElementById('typing-indicator').classList.add('hidden');

                if (response.ok) {
                    appendAIMessage(data.response, false, data.response);
                } else {
                    appendAIMessage('⚠️ **Erro de Comunicação:** ' + data.error, true);
                }
            } catch (error) {
                document.getElementById('typing-indicator').classList.add('hidden');
                appendAIMessage('❌ **Erro:** Servidor inacessível.', true);
            }
        }

        function appendUserMessage(text) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.innerHTML = `<div class="font-bold mb-1 text-sm text-black/80">Você:</div>${text}`;
            msgDiv.className = 'msg-user p-3 px-5 shadow-sm text-sm';
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendAIMessage(htmlText, isError = false, rawText = '') {
            const chatBox = document.getElementById('chat-box');
            const container = document.createElement('div');
            container.className = 'msg-ia-container';

            const msgDiv = document.createElement('div');
            msgDiv.className = isError ? 'msg-ia p-4 text-sm border-l-2 border-red-500 bg-red-900/20' : 'msg-ia p-4 text-sm';
            msgDiv.innerHTML = marked.parse(htmlText);
            container.appendChild(msgDiv);

            if (!isError) {
                const actionDiv = document.createElement('div');
                actionDiv.className = 'flex gap-4 mt-2 ml-1';
                
                const btnOuvir = document.createElement('span');
                btnOuvir.className = 'btn-action';
                btnOuvir.innerHTML = '🔊 Ouvir';
                btnOuvir.onclick = () => ouvirTexto(rawText);
                
                const btnObsidian = document.createElement('span');
                btnObsidian.className = 'btn-action';
                btnObsidian.innerHTML = '💎 Salvar no Obsidian';
                btnObsidian.onclick = () => salvarNoObsidian(rawText);

                actionDiv.appendChild(btnOuvir);
                actionDiv.appendChild(btnObsidian);
                container.appendChild(actionDiv);
            }

            chatBox.appendChild(container);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
