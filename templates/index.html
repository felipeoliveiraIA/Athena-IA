<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATHENA IA v5.3 Prime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0d0d0f',
                        panelbg: '#161618',
                        gold: '#F4D03F', /* Tom de ouro claro solicitado */
                        goldhover: '#D4AC0D'
                    }
                }
            }
        }
    </script>
    <style>
        /* Estilização Scrollbar e Markdown */
        body { background-color: #0d0d0f; color: #e5e5e5; font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .markdown-body h2 { font-size: 1.25rem; color: #F4D03F; margin-top: 1rem; border-bottom: 1px solid #333; padding-bottom: 4px;}
        .markdown-body h3 { font-size: 1.1rem; color: #e5e5e5; margin-top: 0.8rem; }
        .markdown-body strong { color: #F4D03F; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body p { margin-bottom: 0.8rem; line-height: 1.6; }
        .markdown-body pre { background: #000; padding: 1rem; border-radius: 6px; overflow-x: auto; margin-bottom: 1rem; border: 1px solid #333; }
        .markdown-body code { font-family: monospace; color: #F4D03F; }
        .chat-input:empty:before { content: attr(data-placeholder); color: #666; pointer-events: none; display: block; }
        
        /* Dropdown Estilo Gemini */
        .dropdown-menu { display: none; position: absolute; right: 10px; top: 30px; background: #1f1f23; border: 1px solid #333; border-radius: 8px; z-index: 50; width: 180px; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        .dropdown-menu.active { display: block; }
        .dropdown-item { padding: 10px 15px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; transition: background 0.2s; }
        .dropdown-item:hover { background: #333; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Barra Lateral -->
    <aside class="w-72 bg-panelbg border-r border-gray-800 flex flex-col p-4 flex-shrink-0 relative">
        <div class="flex items-center gap-3 mb-6">
            <span class="text-2xl">🦉</span>
            <div>
                <h1 class="font-bold tracking-wider text-gray-100">A.T.H.E.N.A. OS</h1>
                <span class="text-xs font-semibold bg-gold text-black px-2 py-0.5 rounded-full">v5.3 Prime</span>
            </div>
        </div>

        <button onclick="toggleMemoryPanel()" class="w-full flex items-center justify-center gap-2 bg-gray-800 hover:bg-gray-700 text-sm py-2 rounded-lg mb-3 transition">
            <i class="fa-solid fa-brain text-pink-400"></i> Memória & Perfil
        </button>

        <button onclick="createNewChat()" class="w-full flex items-center justify-center gap-2 bg-gold hover:bg-goldhover text-black font-bold py-3 rounded-lg mb-6 shadow-lg transition">
            <i class="fa-solid fa-plus"></i> Nova Conversa
        </button>

        <h3 class="text-xs text-gray-500 font-bold mb-3 tracking-widest">CONVERSAS SALVAS:</h3>
        
        <div id="chat-list" class="flex-1 overflow-y-auto space-y-2 pr-1">
            <!-- Chats dinâmicos injetados aqui -->
        </div>

        <div class="mt-4 pt-4 border-t border-gray-800 text-xs text-gray-400 flex justify-between items-center">
            <span>Nível: <strong class="text-gold">Veterano</strong></span>
            <button onclick="exportDataBunker()" title="Exportar Backup de Segurança (Bunker)" class="hover:text-white transition"><i class="fa-solid fa-download"></i> Backup</button>
        </div>
    </aside>

    <!-- Área Principal de Chat -->
    <main class="flex-1 flex flex-col relative bg-darkbg">
        
        <!-- Cabeçalho Superior (Estilo Print 4) -->
        <header class="h-16 flex items-center justify-between px-6 border-b border-gray-800 bg-panelbg/80 backdrop-blur-md z-10">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-gold flex items-center justify-center text-black font-bold text-sm">AT</div>
                <div>
                    <h2 id="current-chat-title" class="font-bold text-gray-200">Nova Conversa</h2>
                    <span class="text-xs text-gray-500">Pronta para uso</span>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <select id="model-select" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-gray-200 focus:outline-none focus:border-gold">
                    <option value="openrouter|google/gemini-2.0-flash-exp:free">⚡ Nuvem (Gemini 2.0 Flash Free)</option>
                    <option value="openrouter|qwen/qwen-vl-plus:free">⚡ Nuvem (Qwen VL Plus Free)</option>
                    <option value="openrouter|meta-llama/llama-3-8b-instruct:free">⚡ Nuvem (Llama 3 8B Free)</option>
                    <option value="local|lm-studio">🖥️ Local (LM Studio HD)</option>
                </select>

                <select id="tts-speed" class="bg-gray-800 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200 focus:outline-none">
                    <option value="0.75">0.75x</option>
                    <option value="1" selected>1.0x</option>
                    <option value="1.5">1.50x</option>
                    <option value="2">2.0x</option>
                </select>

                <button onclick="toggleLiveMode()" id="live-btn" class="flex items-center gap-2 px-4 py-1.5 rounded-full border border-gray-700 bg-gray-800 hover:bg-gray-700 text-sm font-semibold transition">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Modo Live
                </button>
            </div>
        </header>

        <!-- Área de Mensagens -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-6 space-y-6 pb-32">
            <!-- Balões injetados via JS -->
        </div>

        <!-- Input Estilo WhatsApp -->
        <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-darkbg via-darkbg to-transparent">
            <div class="max-w-4xl mx-auto bg-panelbg border border-gray-700 rounded-2xl flex items-end p-2 gap-2 shadow-2xl relative">
                <label class="cursor-pointer p-3 text-gray-400 hover:text-gold transition rounded-full hover:bg-gray-800">
                    <i class="fa-solid fa-paperclip"></i>
                    <input type="file" id="file-upload" class="hidden" accept="image/*,.pdf" onchange="handleFileUpload(event)">
                </label>
                
                <div id="message-input" contenteditable="true" data-placeholder="Digite sua mensagem ou comando (Shift+Enter para pular linha)..." class="chat-input w-full max-h-40 overflow-y-auto text-gray-200 outline-none py-3 px-2"></div>
                
                <button onclick="startVoiceRecognition()" id="mic-btn" class="p-3 text-gray-400 hover:text-white transition rounded-full hover:bg-gray-800">
                    <i class="fa-solid fa-microphone"></i>
                </button>

                <button onclick="sendMessage()" class="p-3 bg-gold text-black rounded-xl hover:bg-goldhover transition shadow-lg flex items-center justify-center min-w-[48px]">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
        
    </main>

    <!-- Lógica Core do Sistema -->
    <script>
        // -------------------------------------------------------------
        // 1. BANCO DE DADOS LOCAL (INDEXEDDB) - BLINDAGEM CONTRA PERDAS
        // -------------------------------------------------------------
        const dbName = "AthenaOS_DB";
        let db;
        let currentChatId = null;
        let chats = [];

        const request = indexedDB.open(dbName, 1);
        request.onupgradeneeded = (event) => {
            db = event.target.result;
            if (!db.objectStoreNames.contains("chats")) {
                db.createObjectStore("chats", { keyPath: "id" });
            }
        };
        request.onsuccess = (event) => {
            db = event.target.result;
            loadSidebarChats();
        };

        function saveChatToDB(chatObj) {
            const tx = db.transaction("chats", "readwrite");
            tx.objectStore("chats").put(chatObj);
            tx.oncomplete = () => loadSidebarChats();
        }

        function loadSidebarChats() {
            const tx = db.transaction("chats", "readonly");
            const store = tx.objectStore("chats");
            const req = store.getAll();
            req.onsuccess = () => {
                chats = req.result.sort((a, b) => b.updatedAt - a.updatedAt);
                renderSidebar();
                if(!currentChatId && chats.length > 0) openChat(chats[0].id);
                else if (chats.length === 0) createNewChat();
            };
        }

        // -------------------------------------------------------------
        // 2. GESTÃO DE UI E MENUS DA BARRA LATERAL
        // -------------------------------------------------------------
        function createNewChat() {
            const newChat = {
                id: Date.now().toString(),
                title: "Nova Conversa",
                messages: [],
                isPinned: false,
                retention: "1_month",
                updatedAt: Date.now()
            };
            currentChatId = newChat.id;
            saveChatToDB(newChat);
            document.getElementById("chat-container").innerHTML = "";
            document.getElementById("current-chat-title").innerText = newChat.title;
        }

        function renderSidebar() {
            const list = document.getElementById("chat-list");
            list.innerHTML = "";
            chats.forEach(chat => {
                const isActive = chat.id === currentChatId ? 'border-gold bg-gray-800' : 'border-transparent hover:bg-gray-800 text-gray-400';
                const pinIcon = chat.isPinned ? '<i class="fa-solid fa-thumbtack text-pink-500 text-xs"></i>' : '';
                
                list.innerHTML += `
                    <div class="relative group flex items-center justify-between border ${isActive} rounded-lg p-3 cursor-pointer transition" onclick="openChat('${chat.id}')">
                        <div class="flex items-center gap-2 truncate w-4/5">
                            <i class="fa-regular fa-message text-sm"></i>
                            <span class="truncate text-sm font-medium" id="title-${chat.id}">${chat.title}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            ${pinIcon}
                            <button onclick="toggleDropdown(event, '${chat.id}')" class="text-gray-500 hover:text-white hidden group-hover:block px-1">⋮</button>
                        </div>
                        
                        <!-- Menu Dropdown Estilo Print 3 -->
                        <div id="drop-${chat.id}" class="dropdown-menu">
                            <div class="dropdown-item" onclick="shareChat(event, '${chat.id}')"><i class="fa-solid fa-share-nodes"></i> Compartilhar</div>
                            <div class="dropdown-item" onclick="pinChat(event, '${chat.id}')"><i class="fa-solid fa-thumbtack"></i> Fixar</div>
                            <div class="dropdown-item" onclick="renameChatPrompt(event, '${chat.id}')"><i class="fa-solid fa-pen"></i> Renomear</div>
                            <hr class="border-gray-700 my-1">
                            <div class="dropdown-item text-red-400 hover:text-red-300" onclick="deleteChat(event, '${chat.id}')"><i class="fa-solid fa-trash"></i> Excluir</div>
                        </div>
                    </div>
                `;
            });
        }

        function toggleDropdown(e, id) {
            e.stopPropagation();
            document.querySelectorAll('.dropdown-menu').forEach(el => el.classList.remove('active'));
            document.getElementById(`drop-${id}`).classList.add('active');
        }

        // Fecha dropdowns ao clicar fora
        document.addEventListener('click', () => {
            document.querySelectorAll('.dropdown-menu').forEach(el => el.classList.remove('active'));
        });

        // Funções de Ação do Dropdown
        function deleteChat(e, id) {
            e.stopPropagation();
            if(confirm("Deseja mesmo excluir esta conversa?")) {
                const tx = db.transaction("chats", "readwrite");
                tx.objectStore("chats").delete(id);
                tx.oncomplete = () => {
                    if(currentChatId === id) currentChatId = null;
                    loadSidebarChats();
                };
            }
        }

        function pinChat(e, id) {
            e.stopPropagation();
            const chat = chats.find(c => c.id === id);
            if(chat) {
                chat.isPinned = !chat.isPinned;
                saveChatToDB(chat);
            }
        }

        function renameChatPrompt(e, id) {
            e.stopPropagation();
            const newTitle = prompt("Novo nome para a conversa:");
            if(newTitle) {
                const chat = chats.find(c => c.id === id);
                chat.title = newTitle;
                saveChatToDB(chat);
            }
        }

        // -------------------------------------------------------------
        // 3. RENDERIZAÇÃO DE CHAT E MENSAGENS (ESTILO PRINT 4)
        // -------------------------------------------------------------
        function openChat(id) {
            currentChatId = id;
            const chat = chats.find(c => c.id === id);
            document.getElementById("current-chat-title").innerText = chat.title;
            const container = document.getElementById("chat-container");
            container.innerHTML = "";
            renderSidebar();
            
            chat.messages.forEach(msg => appendMessageUI(msg.role, msg.content, msg.id));
            container.scrollTop = container.scrollHeight;
        }

        function appendMessageUI(role, content, msgId) {
            const container = document.getElementById("chat-container");
            const div = document.createElement("div");
            div.className = "flex w-full " + (role === 'user' ? "justify-end" : "justify-start");
            
            // Design visual correspondente ao Print 4 (ouro pro usuario, chumbo pra IA)
            if (role === 'user') {
                div.innerHTML = `
                    <div class="max-w-[75%] bg-gold text-black rounded-2xl rounded-tr-sm p-4 shadow-md relative group">
                        <div class="flex justify-between items-start mb-2">
                            <span class="font-bold text-sm">Você</span>
                            <button class="text-black/60 hover:text-black text-xs bg-black/10 px-2 py-1 rounded hidden group-hover:flex items-center gap-1"><i class="fa-solid fa-arrows-rotate"></i> Reenviar</button>
                        </div>
                        <div class="text-sm whitespace-pre-wrap">${content}</div>
                    </div>
                `;
            } else {
                const htmlContent = marked.parse(content);
                div.innerHTML = `
                    <div class="max-w-[85%] bg-gray-800 border border-gray-700 text-gray-200 rounded-2xl rounded-tl-sm p-5 shadow-md relative">
                        <div class="markdown-body text-sm">${htmlContent}</div>
                        <div class="mt-4 flex gap-2 border-t border-gray-700 pt-3">
                            <button onclick="speakText('${encodeURIComponent(content)}')" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg flex items-center gap-2 transition"><i class="fa-solid fa-volume-high"></i> Ouvir</button>
                            <button onclick="saveToObsidian('${encodeURIComponent(content)}')" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg flex items-center gap-2 transition"><i class="fa-solid fa-book"></i> Exportar Obsidian</button>
                            <button onclick="copyText(this)" class="text-xs text-gray-400 hover:text-white px-2"><i class="fa-solid fa-copy"></i> Copiar</button>
                        </div>
                    </div>
                `;
            }
            container.appendChild(div);
            scrollToBottom();
        }

        // -------------------------------------------------------------
        // 4. LÓGICA DE ENVIO E COMUNICAÇÃO (API)
        // -------------------------------------------------------------
        async function sendMessage() {
            const inputEl = document.getElementById("message-input");
            const text = inputEl.innerText.trim();
            if (!text) return;

            inputEl.innerText = "";
            const msgId = Date.now().toString();
            
            // Atualiza DB
            const chat = chats.find(c => c.id === currentChatId);
            chat.messages.push({ id: msgId, role: 'user', content: text });
            chat.updatedAt = Date.now();
            if(chat.messages.length === 1) chat.title = text.substring(0, 25) + "...";
            saveChatToDB(chat);
            
            appendMessageUI('user', text, msgId);

            // Seleção de Modelo
            const selection = document.getElementById("model-select").value.split('|');
            const provider = selection[0];
            const modelName = selection[1];

            // Feedback visual de carregamento
            const loaderId = "loader-" + Date.now();
            const container = document.getElementById("chat-container");
            container.innerHTML += `<div id="${loaderId}" class="flex justify-start"><div class="max-w-[85%] bg-gray-800 border border-gray-700 text-gray-400 rounded-2xl p-4 text-sm animate-pulse">🦉 ATHENA está processando...</div></div>`;
            scrollToBottom();

            try {
                // Preparar histórico para API (limitado a 10 últimas mensagens para economizar tokens)
                const apiMessages = chat.messages.slice(-10).map(m => ({ role: m.role, content: m.content }));
                
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        provider: provider,
                        model: modelName,
                        messages: apiMessages,
                        system_prompt: "Você é ATHENA OS v5.3. Responda sempre em Markdown estruturado. Use LaTeX ($$) estritamente para fórmulas matemáticas e científicas."
                    })
                });

                document.getElementById(loaderId).remove();
                const data = await response.json();
                
                if (data.error) throw new Error(data.error);

                const aiMsgId = Date.now().toString();
                chat.messages.push({ id: aiMsgId, role: 'assistant', content: data.reply });
                saveChatToDB(chat);
                appendMessageUI('assistant', data.reply, aiMsgId);

            } catch (err) {
                document.getElementById(loaderId).remove();
                const errorMsg = "⚠️ **Erro de Conexão:**\n" + err.message;
                appendMessageUI('assistant', errorMsg, Date.now().toString());
            }
        }

        // Shift+Enter para enviar
        document.getElementById('message-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // -------------------------------------------------------------
        // 5. MOTOR TTS (SÍNTESE DE VOZ) & ECHO SUPPRESSION
        // -------------------------------------------------------------
        let isSpeaking = false;
        function speakText(encodedText) {
            if (isSpeaking) {
                speechSynthesis.cancel();
                isSpeaking = false;
                return;
            }
            
            const text = decodeURIComponent(encodedText).replace(/[#*`_]/g, ''); // Limpa markdown para a voz
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = parseFloat(document.getElementById("tts-speed").value);
            
            // Tenta achar voz feminina PT-BR (Google português do Brasil)
            const voices = speechSynthesis.getVoices();
            const ptVoice = voices.find(v => v.lang === 'pt-BR' && v.name.includes('Female')) || voices.find(v => v.lang === 'pt-BR');
            if(ptVoice) utterance.voice = ptVoice;

            utterance.onstart = () => { isSpeaking = true; };
            utterance.onend = () => { isSpeaking = false; };
            speechSynthesis.speak(utterance);
        }

        // -------------------------------------------------------------
        // 6. UTILITÁRIOS: OBSIDIAN, EXPORTAR BUNKER E SCROLL
        // -------------------------------------------------------------
        function saveToObsidian(encodedText) {
            const text = decodeURIComponent(encodedText);
            const blob = new Blob([text], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ATHENA_Nota_${new Date().toISOString().split('T')[0]}.md`;
            a.click();
        }

        function exportDataBunker() {
            // Fazer backup de todos os chats em uma pasta virtual JSON
            const dataStr = JSON.stringify(chats, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `AthenaOS_Bunker_Backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            alert("Bunker Exportado! Guarde este arquivo JSON para não perder seu histórico de Vibe-Coding e Estudos Médicos em caso de formatação do PC.");
        }

        function copyText(btn) {
            const container = btn.closest('div.relative').querySelector('.markdown-body');
            navigator.clipboard.writeText(container.innerText);
            btn.innerHTML = '<i class="fa-solid fa-check text-green-400"></i> Copiado';
            setTimeout(() => btn.innerHTML = '<i class="fa-solid fa-copy"></i> Copiar', 2000);
        }

        function scrollToBottom() {
            const c = document.getElementById("chat-container");
            c.scrollTop = c.scrollHeight;
        }
    </script>
</body>
</html>
