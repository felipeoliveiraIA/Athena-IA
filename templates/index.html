<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.T.H.E.N.A. Prime</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 250px; background-color: #1e1e1e; padding: 20px; border-right: 2px solid #ff9800; display: flex; flex-direction: column; gap: 15px; }
        .main-chat { flex: 1; display: flex; flex-direction: column; padding: 20px; }
        .chat-box { flex: 1; overflow-y: auto; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 12px 18px; border-radius: 8px; max-width: 80%; line-height: 1.5; }
        .user-msg { background-color: #ff9800; color: #000; align-self: flex-end; }
        .ai-msg { background-color: #2c2c2c; align-self: flex-start; border-left: 4px solid #ff9800; }
        .input-area { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 15px; border-radius: 8px; border: 1px solid #333; background: #1e1e1e; color: white; }
        button { padding: 15px 20px; background-color: #ff9800; color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        select, input[type="range"] { width: 100%; padding: 10px; background: #2c2c2c; color: white; border: 1px solid #444; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>🦉 ATHENA</h2>
        <label>Modo de Processamento:</label>
        <select id="modeSelector">
            <option value="cloud">☁️ Nuvem Autônoma (Gemini)</option>
            <option value="local">💻 HD Externo (Qwen via Ngrok)</option>
        </select>
        <label>Velocidade da Voz:</label>
        <input type="range" id="voiceSpeed" min="0.5" max="2" step="0.1" value="1.2">
    </div>
    
    <div class="main-chat">
        <div class="chat-box" id="chatBox"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Digite sua mensagem ou /sync LINK_NGROK..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            const mode = document.getElementById('modeSelector').value;
            if (!message) return;

            addMessage(message, 'user-msg');
            input.value = '';

            fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message, mode: mode })
            })
            .then(response => response.json())
            .then(data => {
                addMessage(data.response, 'ai-msg');
                speak(data.response);
            })
            .catch(error => addMessage("❌ Erro de comunicação.", 'ai-msg'));
        }

        function addMessage(text, className) {
            const box = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }

        function speak(text) {
            const speed = document.getElementById('voiceSpeed').value;
            const cleanText = text.replace(/[*#]/g, ''); // Limpa markdown para a voz
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'pt-BR';
            utterance.rate = speed;
            speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
