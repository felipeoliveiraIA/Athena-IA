<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATHENA IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Design Visual de Alta Performance (v5.2) */
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .bg-panel { background-color: #1e293b; }
        .accent-gold { color: #fbbf24; }
        .bg-gold { background-color: #fbbf24; color: #0f172a; }
        .bg-gold:hover { background-color: #f59e0b; }
        
        /* Chat WhatsApp-Style */
        .chat-container { display: flex; flex-direction: column; height: 100vh; }
        .messages-area { flex-grow: 1; overflow-y: auto; padding: 1.5rem; scroll-behavior: smooth; }
        .message-bubble { max-width: 80%; padding: 1rem; border-radius: 0.75rem; margin-bottom: 1rem; position: relative; }
        .user-msg { background-color: #334155; margin-left: auto; border-bottom-right-radius: 0; }
        .ai-msg { background-color: #1e293b; border: 1px solid #334155; margin-right: auto; border-bottom-left-radius: 0; }
        
        /* Input expansível */
        #user-input { resize: none; overflow-y: hidden; min-height: 44px; max-height: 200px; }
        
        /* Markdown / LaTeX restrito */
        .markdown-body pre { background: #0f172a; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-top: 0.5rem; }
        .markdown-body code { font-family: monospace; color: #fbbf24; }
        .markdown-body table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        .markdown-body th, .markdown-body td { border: 1px solid #475569; padding: 0.5rem; }
        
        /* Ghost Bubble & Mic Pulse */
        .ghost-bubble { border: 2px dashed #475569; opacity: 0.7; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
        .mic-active { border-radius: 50%; animation: pulse 2s infinite; background-color: #22c55e; width: 12px; height: 12px; display: inline-block; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Barra Lateral (Gestão de Sessões & Bunker) -->
    <aside class="w-80 bg-panel border-r border-slate-700 flex flex-col transition-all duration-300">
        <div class="p-4 border-b border-slate-700 flex items-center justify-between">
            <h1 class="text-xl font-bold accent-gold"><i class="fa-solid fa-owl"></i> ATHENA IA</h1>
            <button onclick="createNewChat()" class="text-slate-300 hover:accent-gold"><i class="fa-solid fa-plus"></i></button>
        </div>
        
        <div class="p-2 space-y-2">
            <button class="w-full text-left p-2 rounded hover:bg-slate-700 text-sm flex items-center gap-2" onclick="openProfile()">
                <i class="fa-solid fa-brain accent-gold"></i> Memória & Perfil
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-2 space-y-1" id="chat-list">
            <!-- Chats carregados do IndexedDB via JS -->
        </div>

        <div class="p-4 border-t border-slate-700">
            <button onclick="exportBunker()" class="w-full py-2 bg-slate-700 hover:bg-slate-600 rounded text-sm flex justify-center items-center gap-2">
                <i class="fa-solid fa-box-archive"></i> Exportar Bunker (Backup)
            </button>
        </div>
    </aside>

    <!-- Área Principal de Chat -->
    <main class="flex-1 chat-container">
        <!-- Cabeçalho -->
        <header class="bg-panel p-4 border-b border-slate-700 flex justify-between items-center shadow-md z-10">
            <div class="flex items-center gap-4">
                <h2 id="current-chat-title" class="font-semibold text-lg">Nova Conversa</h2>
                <select id="retention-select" class="bg-slate-700 text-xs p-1 rounded cursor-pointer" onchange="updateRetention()">
                    <option value="30">Reter: 1 Mês</option>
                    <option value="60">Reter: 2 Meses</option>
                    <option value="180">Reter: 6 Meses</option>
                    <option value="365">Reter: 1 Ano</option>
                    <option value="1825">Reter: 5 Anos</option>
                    <option value="permanent">📌 Fixar Permanente</option>
                </select>
            </div>
            
            <div class="flex items-center gap-3">
                <!-- Controle de Velocidade TTS -->
                <select id="tts-speed" class="bg-slate-700 text-xs p-1 rounded cursor-pointer" onchange="updateTTSSpeed()">
                    <option value="0.75">0.75x</option>
                    <option value="1.0" selected>Voz: 1.0x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.50x</option>
                    <option value="2.0">2.0x</option>
                    <option value="4.0">4.0x</option>
                </select>
                
                <!-- Modelos Vibe-Coding -->
                <select id="model-selector" class="bg-slate-700 p-2 rounded text-sm cursor-pointer border border-slate-600">
                    <option value="Nuvem (Qwen Coder)" selected>🧠 Nuvem (Qwen Coder 32B)</option>
                    <option value="Nuvem (Gemini)">⚡ Nuvem (Gemini Pro 1.5)</option>
                    <option value="HD Local (LM Studio)">💻 HD Local (Porta 1234)</option>
                </select>
                <button onclick="startLiveMode()" class="bg-gold px-4 py-2 rounded text-sm font-bold shadow-lg hover:scale-105 transition">
                    <i class="fa-solid fa-video"></i> Modo Live (PiP)
                </button>
            </div>
        </header>

        <!-- Mensagens -->
        <div id="chat-messages" class="messages-area">
            <div class="text-center text-slate-500 mt-10 text-sm">
                <i class="fa-solid fa-shield-halved text-2xl mb-2"></i><br>
                Bunker IndexedDB Ativo.<br>Suas conversas estão salvas localmente.
            </div>
        </div>

        <!-- Input Estilo WhatsApp -->
        <div class="p-4 bg-panel border-t border-slate-700">
            <div class="flex items-end gap-2 bg-slate-800 p-2 rounded-xl border border-slate-600 focus-within:border-gold transition">
                <button class="text-slate-400 hover:text-white p-2" title="Anexar (Visão Computacional)"><i class="fa-solid fa-paperclip"></i></button>
                <textarea id="user-input" class="w-full bg-transparent outline-none text-white p-2" placeholder="Digite sua mensagem (Shift + Enter para pular linha)..." rows="1"></textarea>
                <button onclick="sendMessage()" class="bg-gold text-slate-900 w-10 h-10 rounded-full flex justify-center items-center hover:scale-110 transition shrink-0">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        // ==========================================
        // 1. ARQUITETURA DE DADOS (IndexedDB Bunker)
        // ==========================================
        let db;
        let currentChatId = null;
        let chatHistory = [];
        let isSpeaking = false;
        let currentUtterance = null;
        let lastAiMessage = "";

        const initDB = () => {
            const request = indexedDB.open("AthenaOS_DB", 1);
            request.onupgradeneeded = (e) => {
                db = e.target.result;
                if (!db.objectStoreNames.contains("chats")) {
                    db.createObjectStore("chats", { keyPath: "id" });
                }
            };
            request.onsuccess = (e) => {
                db = e.target.result;
                loadChatList();
            };
        };

        const saveChat = () => {
            if (!currentChatId) return;
            const tx = db.transaction("chats", "readwrite");
            const store = tx.objectStore("chats");
            const title = document.getElementById("current-chat-title").innerText;
            const retention = document.getElementById("retention-select").value;
            store.put({
                id: currentChatId,
                title: title,
                messages: chatHistory,
                retention: retention,
                updatedAt: Date.now()
            });
            loadChatList();
        };

        const loadChatList = () => {
            const tx = db.transaction("chats", "readonly");
            const store = tx.objectStore("chats");
            const request = store.getAll();
            request.onsuccess = () => {
                const list = document.getElementById("chat-list");
                list.innerHTML = "";
                const now = Date.now();
                
                request.result.sort((a, b) => b.updatedAt - a.updatedAt).forEach(chat => {
                    // Lógica de Autoexclusão Automática
                    if (chat.retention !== 'permanent') {
                        const daysMs = parseInt(chat.retention) * 24 * 60 * 60 * 1000;
                        if (now - chat.updatedAt > daysMs) {
                            deleteChat(chat.id, true); return;
                        }
                    }

                    const div = document.createElement("div");
                    div.className = `p-2 rounded cursor-pointer text-sm flex justify-between items-center group ${chat.id === currentChatId ? 'bg-slate-700 border-l-2 border-gold' : 'hover:bg-slate-700'}`;
                    
                    const titleSpan = document.createElement("span");
                    titleSpan.innerText = (chat.retention === 'permanent' ? '📌 ' : '') + chat.title;
                    titleSpan.className = "truncate flex-1";
                    titleSpan.onclick = () => openChat(chat.id, chat.title, chat.messages, chat.retention);
                    
                    // Menu de 3 pontinhos (Estilo Gemini)
                    const menuBtn = document.createElement("button");
                    menuBtn.innerHTML = '<i class="fa-solid fa-ellipsis-vertical text-slate-400 group-hover:text-white"></i>';
                    menuBtn.className = "px-2";
                    menuBtn.onclick = (e) => showChatMenu(e, chat.id);

                    div.appendChild(titleSpan);
                    div.appendChild(menuBtn);
                    list.appendChild(div);
                });
            };
        };

        const createNewChat = () => {
            currentChatId = Date.now().toString();
            chatHistory = [];
            document.getElementById("current-chat-title").innerText = "Nova Conversa";
            document.getElementById("chat-messages").innerHTML = "";
            document.getElementById("retention-select").value = "30";
            saveChat();
        };

        const openChat = (id, title, messages, retention) => {
            currentChatId = id;
            chatHistory = messages;
            document.getElementById("current-chat-title").innerText = title;
            document.getElementById("retention-select").value = retention || "30";
            renderMessages();
            loadChatList();
        };

        const updateRetention = () => { saveChat(); };

        // ==========================================
        // 1.1 MENU LATERAL DE AÇÕES (Compartilhar, Renomear, Excluir)
        // ==========================================
        const showChatMenu = (e, id) => {
            e.stopPropagation();
            // Remove menus antigos
            document.querySelectorAll('.chat-context-menu').forEach(el => el.remove());
            
            const menu = document.createElement("div");
            menu.className = "chat-context-menu absolute bg-slate-800 border border-slate-600 rounded shadow-xl p-1 z-50 text-xs w-48";
            menu.style.top = `${e.clientY}px`;
            menu.style.left = `${e.clientX}px`;

            const btnClass = "w-full text-left p-2 hover:bg-slate-700 rounded block text-slate-200";

            // NOVO: Botão de Compartilhar
            const btnShare = document.createElement("button");
            btnShare.className = btnClass;
            btnShare.innerHTML = '<i class="fa-solid fa-link w-4"></i> Compartilhar';
            btnShare.onclick = () => { shareChat(id); menu.remove(); };

            const btnRename = document.createElement("button");
            btnRename.className = btnClass;
            btnRename.innerHTML = '<i class="fa-solid fa-pen w-4"></i> Renomear';
            btnRename.onclick = () => { renameChat(id); menu.remove(); };

            const btnDelete = document.createElement("button");
            btnDelete.className = btnClass + " text-red-400 hover:bg-red-900/30";
            btnDelete.innerHTML = '<i class="fa-solid fa-trash w-4"></i> Excluir';
            btnDelete.onclick = () => { deleteChat(id); menu.remove(); };

            menu.appendChild(btnShare);
            menu.appendChild(btnRename);
            menu.appendChild(btnDelete);
            document.body.appendChild(menu);

            // Fecha menu ao clicar fora
            setTimeout(() => { document.addEventListener('click', () => menu.remove(), {once: true}); }, 100);
        };

        const shareChat = (id) => {
            const tx = db.transaction("chats", "readonly");
            const store = tx.objectStore("chats");
            store.get(id).onsuccess = (e) => {
                const chat = e.target.result;
                if(!chat || chat.messages.length === 0) return alert("Conversa vazia.");
                let text = `ATHENA IA - Histórico: ${chat.title}\n\n`;
                chat.messages.forEach(m => { text += `[${m.role === 'user' ? 'Você' : 'ATHENA IA'}]: ${m.content}\n\n`; });
                
                if (navigator.share) {
                    navigator.share({ title: chat.title, text: text }).catch(console.error);
                } else {
                    navigator.clipboard.writeText(text).then(() => alert("Texto copiado para a área de transferência."));
                }
            };
        };

        const renameChat = (id) => {
            const newName = prompt("Novo nome para a conversa:");
            if (newName) {
                const tx = db.transaction("chats", "readwrite");
                tx.objectStore("chats").get(id).onsuccess = (e) => {
                    let chat = e.target.result;
                    chat.title = newName;
                    tx.objectStore("chats").put(chat);
                    if(id === currentChatId) document.getElementById("current-chat-title").innerText = newName;
                    loadChatList();
                };
            }
        };

        const deleteChat = (id, auto = false) => {
            if (auto || confirm("Tem certeza que deseja excluir esta conversa?")) {
                db.transaction("chats", "readwrite").objectStore("chats").delete(id);
                if (currentChatId === id) createNewChat();
                else loadChatList();
            }
        };

        const exportBunker = () => {
            const request = db.transaction("chats", "readonly").objectStore("chats").getAll();
            request.onsuccess = () => {
                const blob = new Blob([JSON.stringify(request.result, null, 2)], { type: "application/json" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = `AthenaOS_Bunker_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
            };
        };

        // ==========================================
        // 2. INTERFACE E COMUNICAÇÃO (Markdown, Resend, Obsidian)
        // ==========================================
        
        // Auto-expand textarea (WhatsApp style)
        const userInput = document.getElementById("user-input");
        userInput.addEventListener("input", function() {
            this.style.height = "auto";
            this.style.height = (this.scrollHeight) + "px";
        });
        userInput.addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        const renderMessages = () => {
            const container = document.getElementById("chat-messages");
            container.innerHTML = "";
            chatHistory.forEach((msg, index) => {
                if(msg.role === 'system') return;
                
                const div = document.createElement("div");
                div.className = `message-bubble ${msg.role === 'user' ? 'user-msg' : 'ai-msg markdown-body'}`;
                
                if (msg.role === 'user') {
                    div.innerText = msg.content;
                    // Botão Reenviar 🔄
                    const resendBtn = document.createElement("button");
                    resendBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
                    resendBtn.className = "absolute -left-8 top-2 text-slate-500 hover:accent-gold";
                    resendBtn.title = "Reenviar mensagem";
                    resendBtn.onclick = () => resendMessage(index);
                    div.appendChild(resendBtn);
                } else {
                    div.innerHTML = marked.parse(msg.content);
                    // Ferramentas da IA (TTS, Obsidian, Copiar)
                    const tools = document.createElement("div");
                    tools.className = "mt-3 pt-2 border-t border-slate-600 flex gap-3 text-xs text-slate-400";
                    tools.innerHTML = `
                        <button onclick="toggleTTS(this, \`${msg.content.replace(/`/g, "'")}\`)" class="hover:text-white"><i class="fa-solid fa-volume-high"></i> Ouvir</button>
                        <button onclick="exportObsidian(\`${msg.content.replace(/`/g, "'")}\`)" class="hover:text-purple-400"><i class="fa-solid fa-gem"></i> Obsidian</button>
                        <button onclick="copyText(\`${msg.content.replace(/`/g, "'")}\`)" class="hover:text-white"><i class="fa-solid fa-copy"></i> Copiar</button>
                    `;
                    div.appendChild(tools);
                }
                container.appendChild(div);
            });
            smartScroll();
        };

        const smartScroll = () => {
            const container = document.getElementById("chat-messages");
            container.scrollTop = container.scrollHeight;
        };

        const copyText = (text) => { navigator.clipboard.writeText(text); };
        const exportObsidian = (text) => {
            const blob = new Blob([text], { type: "text/markdown" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `Athena_Note_${Date.now()}.md`;
            a.click();
        };

        const resendMessage = (index) => {
            const textToResend = chatHistory[index].content;
            // Remove a mensagem atual e as respostas subsequentes
            chatHistory = chatHistory.slice(0, index);
            document.getElementById("user-input").value = textToResend;
            sendMessage();
        };

        const sendMessage = async () => {
            const input = document.getElementById("user-input");
            const text = input.value.trim();
            if (!text) return;

            if (!currentChatId) createNewChat();
            
            // Gera título automaticamente se for a primeira mensagem
            if (chatHistory.length === 0) {
                document.getElementById("current-chat-title").innerText = text.substring(0, 30) + "...";
            }

            chatHistory.push({ role: "user", content: text });
            input.value = "";
            input.style.height = "auto";
            renderMessages();
            saveChat();

            const provider = document.getElementById("model-selector").value;
            
            // Adiciona indicador de digitação
            const typingDiv = document.createElement("div");
            typingDiv.id = "typing-indicator";
            typingDiv.className = "message-bubble ai-msg text-slate-400 italic";
            typingDiv.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processando...';
            document.getElementById("chat-messages").appendChild(typingDiv);
            smartScroll();

            try {
                // Rota exata '/chat' conectando ao backend
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ provider: provider, messages: chatHistory })
                });

                document.getElementById("typing-indicator").remove();

                if (!response.ok) {
                    const errData = await response.json();
                    alert(errData.error || "Erro na comunicação com a API.");
                    return;
                }

                const data = await response.json();
                const aiText = data.choices[0].message.content;
                chatHistory.push({ role: "assistant", content: aiText });
                lastAiMessage = aiText;
                
                renderMessages();
                saveChat();

            } catch (error) {
                document.getElementById("typing-indicator").remove();
                alert("Falha ao conectar com o servidor Flask.");
            }
        };

        // ==========================================
        // 3. TTS E CONTROLE DE ÁUDIO (Echo Suppression)
        // ==========================================
        const toggleTTS = (btn, text) => {
            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                btn.innerHTML = '<i class="fa-solid fa-volume-high"></i> Ouvir';
                return;
            }

            // Echo suppression logic (se microfone estivesse ativo)
            document.querySelectorAll('button').forEach(b => {
                if(b.innerText.includes('Parar')) b.innerHTML = '<i class="fa-solid fa-volume-high"></i> Ouvir';
            });

            isSpeaking = true;
            btn.innerHTML = '<i class="fa-solid fa-stop text-red-500"></i> Parar';
            
            currentUtterance = new SpeechSynthesisUtterance(text);
            currentUtterance.rate = parseFloat(document.getElementById("tts-speed").value);
            
            // Procura voz feminina nativa
            const voices = window.speechSynthesis.getVoices();
            const femaleVoice = voices.find(v => (v.lang.includes('pt') || v.lang.includes('es')) && v.name.toLowerCase().includes('female'));
            if(femaleVoice) currentUtterance.voice = femaleVoice;

            currentUtterance.onend = () => {
                isSpeaking = false;
                btn.innerHTML = '<i class="fa-solid fa-volume-high"></i> Ouvir';
            };

            window.speechSynthesis.speak(currentUtterance);
        };

        const updateTTSSpeed = () => {
            if (isSpeaking && currentUtterance) {
                window.speechSynthesis.cancel();
                // Reinicia a fala na nova velocidade imediatamente
                const activeBtn = Array.from(document.querySelectorAll('button')).find(b => b.innerText.includes('Parar'));
                if(activeBtn) {
                    isSpeaking = false;
                    toggleTTS(activeBtn, lastAiMessage);
                }
            }
        };

        // ==========================================
        // 4. MODO LIVE FLUTUANTE (Document PiP API)
        // ==========================================
        const startLiveMode = async () => {
            if (!("documentPictureInPicture" in window)) {
                alert("Seu navegador não suporta a API de Document Picture-in-Picture. Atualize para o Chrome/Edge mais recente.");
                return;
            }
            if(!confirm("ATHENA IA solicita acesso à sua câmera e microfone para o Modo Live. Permitir?")) return;

            try {
                const pipWindow = await window.documentPictureInPicture.requestWindow({
                    width: 350, height: 450
                });

                pipWindow.document.body.style.backgroundColor = "#0f172a";
                pipWindow.document.body.style.color = "white";
                pipWindow.document.body.style.fontFamily = "sans-serif";
                pipWindow.document.body.style.display = "flex";
                pipWindow.document.body.style.flexDirection = "column";

                const header = pipWindow.document.createElement("div");
                header.innerHTML = `
                    <div style="padding:10px; background:#1e293b; display:flex; justify-content:space-between; align-items:center;">
                        <strong>🦉 ATHENA Live</strong>
                        <span class="mic-active" style="width:10px; height:10px; background:#22c55e; border-radius:50%; display:inline-block; box-shadow: 0 0 5px #22c55e;"></span>
                    </div>
                `;
                pipWindow.document.body.appendChild(header);

                const video = pipWindow.document.createElement("video");
                video.autoplay = true;
                video.style.width = "100%";
                video.style.borderBottom = "2px solid #fbbf24";
                pipWindow.document.body.appendChild(video);

                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                video.srcObject = stream;

                const controls = pipWindow.document.createElement("div");
                controls.style.padding = "10px";
                controls.innerHTML = `
                    <button style="width:100%; padding:10px; background:#fbbf24; color:black; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">
                        ⏸️ Pausar Auto-Envio
                    </button>
                    <div style="font-size:12px; color:#94a3b8; margin-top:10px; text-align:center;">
                        O áudio está sendo processado na aba principal.
                    </div>
                `;
                pipWindow.document.body.appendChild(controls);

                pipWindow.addEventListener("pagehide", () => {
                    stream.getTracks().forEach(track => track.stop());
                });

            } catch (err) {
                console.error(err);
                alert("Falha ao iniciar o Modo Live flutuante.");
            }
        };

        // Inicializa o sistema ao carregar
        window.onload = () => {
            initDB();
            // Carrega vozes
            speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
        };
    </script>
</body>
</html>
