<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.T.H.E.N.A. OS v5.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { background-color: #0d0d0f; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .sidebar { background-color: #080809; border-right: 1px solid #1f1f22; }
        .accent-orange { color: #ff9800; }
        .bg-orange { background-color: #ff9800; }
        .chat-container { scroll-behavior: smooth; }
        /* Scrollbar customizada */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background-color: #333; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar Lateral -->
    <aside class="sidebar w-64 flex flex-col p-4">
        <div class="flex items-center gap-2 mb-6">
            <span class="text-2xl">⚡</span>
            <h1 class="text-xl font-bold tracking-wider">A.T.H.E.N.A. <span class="text-xs bg-orange text-black px-1 rounded">v5.2</span></h1>
        </div>
        
        <button class="bg-orange text-black font-bold py-2 px-4 rounded mb-6 hover:bg-orange-600 transition">
            + Nova Sessão
        </button>

        <div class="mb-4">
            <h3 class="text-xs text-gray-500 mb-2 uppercase tracking-wide">Integrações:</h3>
            <label class="flex items-center gap-2 text-sm cursor-pointer">
                <input type="checkbox" id="modo-semiologico" class="rounded bg-gray-800 border-gray-600 text-orange-500 focus:ring-orange-500">
                🩺 Modo Semiológico
            </label>
        </div>

        <!-- Menu de Retenção de Chat -->
        <div class="mt-auto">
            <h3 class="text-xs text-gray-500 mb-2 uppercase tracking-wide">Retenção de Chat:</h3>
            <select id="chat-retention" class="w-full bg-[#1a1a1c] border border-gray-700 text-white text-sm rounded p-2 outline-none">
                <option value="1_month" selected>Excluir em 1 Mês (Padrão)</option>
                <option value="2_months">Excluir em 2 Meses</option>
                <option value="3_months">Excluir em 3 Meses</option>
                <option value="6_months">Excluir em 6 Meses</option>
                <option value="1_year">Excluir em 1 Ano</option>
                <option value="2_years">Excluir em 2 Anos</option>
                <option value="fixed">📌 Fixar Permanentemente</option>
            </select>
        </div>
    </aside>

    <!-- Área Principal do Chat -->
    <main class="flex-1 flex flex-col relative">
        
        <!-- Cabeçalho (Controles) -->
        <header class="h-16 border-b border-[#1f1f22] bg-[#0d0d0f] flex items-center justify-between px-6">
            <select id="model-select" class="bg-[#1a1a1c] border border-gray-700 text-white rounded p-1 outline-none text-sm">
                <option value="qwen">🧠 Nuvem (Qwen Coder 32B)</option>
                <option value="gemini">🧠 Nuvem (Gemini Flash)</option>
                <option value="local">🖥️ Local (LM Studio - 1234)</option>
            </select>

            <div class="flex items-center gap-3">
                <!-- Seletor de Velocidade de Voz -->
                <select id="speed-select" class="bg-[#1a1a1c] border border-gray-700 text-white rounded p-1 text-sm outline-none cursor-pointer">
                    <option value="0.75">0.75x</option>
                    <option value="1.0" selected>1.0x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.50x</option>
                    <option value="2.0">2.0x</option>
                    <option value="3.0">3.0x</option>
                    <option value="4.0">4.0x</option>
                </select>

                <button id="live-btn" class="flex items-center gap-2 bg-[#1a1a1c] hover:bg-gray-800 border border-gray-700 px-3 py-1 text-sm rounded transition">
                    🎤 Live
                </button>
                <div id="live-indicator" class="w-3 h-3 rounded-full bg-red-900"></div>

                <button id="pip-btn" class="bg-[#1a1a1c] hover:bg-gray-800 border border-gray-700 px-3 py-1 text-sm rounded transition">
                    PiP ⧉
                </button>
            </div>
        </header>

        <!-- Container de Mensagens -->
        <div id="chat-box" class="chat-container flex-1 overflow-y-auto p-6 space-y-4">
            <!-- Mensagens aparecerão aqui -->
        </div>

        <!-- Input Estilo WhatsApp -->
        <div class="p-4 bg-[#0d0d0f]">
            <div class="flex items-end gap-2 bg-[#1a1a1c] border border-gray-700 rounded-xl p-2 relative focus-within:border-[#ff9800] transition-colors">
                <button class="p-2 text-gray-400 hover:text-white transition">
                    📎 <!-- Ícone de Anexo -->
                </button>
                <textarea id="user-input" rows="1" class="w-full bg-transparent text-white outline-none resize-none max-h-32 py-2" placeholder="Mensagem (Shift+Enter para pular linha)..."></textarea>
                <button id="send-btn" class="bg-orange text-black font-bold px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-orange-600 transition">
                    Enviar 🦉
                </button>
            </div>
        </div>
    </main>

    <!-- Lógica de Funcionamento (JavaScript) -->
    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const liveBtn = document.getElementById('live-btn');
        const pipBtn = document.getElementById('pip-btn');
        const liveIndicator = document.getElementById('live-indicator');
        const speedSelect = document.getElementById('speed-select');
        let mediaStream = null;

        // 1. Lógica de Envio e Shift+Enter (UX WhatsApp)
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Ajuste automático da altura do textarea
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        sendBtn.addEventListener('click', sendMessage);

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('Você', text, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';

            try {
                // Modifique esta URL para a rota correta do seu Flask backend
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: text,
                        modoSemiologico: document.getElementById('modo-semiologico').checked,
                        modelo: document.getElementById('model-select').value
                    })
                });

                const data = await response.json();
                
                if(data.error) {
                    appendMessage('⚠️ Erro de Comunicação', data.error, 'error');
                } else {
                    appendMessage('🦉 A.T.H.E.N.A.', data.reply, 'ai');
                    speakText(data.reply); // Chama a leitura de voz
                }

            } catch (error) {
                appendMessage('⚠️ Erro Crítico', 'Falha ao conectar com o servidor local. Verifique o Flask.', 'error');
            }
        }

        function appendMessage(sender, text, type) {
            const msgDiv = document.createElement('div');
            
            if (type === 'user') {
                msgDiv.className = 'ml-auto bg-orange text-black p-3 rounded-lg max-w-[75%] shadow-md';
                msgDiv.innerHTML = `<strong>${sender}:</strong><br>${text.replace(/\n/g, '<br>')}`;
            } else if (type === 'error') {
                msgDiv.className = 'bg-red-900/30 border border-red-800 text-red-200 p-4 rounded-lg w-full mb-4 shadow-md';
                msgDiv.innerHTML = `<strong>${sender}:</strong><br>${text}`;
            } else {
                msgDiv.className = 'mr-auto bg-[#1a1a1c] border border-gray-800 text-gray-200 p-4 rounded-lg max-w-[85%] shadow-md';
                // Renderização nativa de Markdown
                const htmlContent = marked.parse(text);
                msgDiv.innerHTML = `<div class="mb-3"><strong>${sender}:</strong></div><div class="prose prose-invert">${htmlContent}</div>`;
                
                // Botão de Integração Obsidian
                const obsidianBtn = document.createElement('button');
                obsidianBtn.className = "mt-3 text-xs bg-gray-800 hover:bg-gray-700 px-2 py-1 rounded text-gray-400";
                obsidianBtn.innerText = "Salvar no Obsidian 🗃️";
                obsidianBtn.onclick = () => saveToObsidian(text);
                msgDiv.appendChild(obsidianBtn);
            }

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 2. Sistema Avançado de Voz e Velocidade
        function speakText(text) {
            // Remove marcações markdown (como ** ou #) para a IA não ler os asteriscos em voz alta
            const cleanText = text.replace(/[*#_`]/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            
            // Aplica a velocidade selecionada no menu
            utterance.rate = parseFloat(speedSelect.value);
            utterance.lang = 'pt-BR';
            
            // Busca uma voz feminina (depende das vozes instaladas no OS do usuário)
            const voices = speechSynthesis.getVoices();
            const femaleVoice = voices.find(v => v.lang.includes('pt') && (v.name.includes('Female') || v.name.includes('Maria') || v.name.includes('Google')));
            if(femaleVoice) utterance.voice = femaleVoice;

            speechSynthesis.speak(utterance);
        }

        // 3. Modo Live (Microfone e Câmera)
        liveBtn.addEventListener('click', async () => {
            if (!mediaStream) {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    liveIndicator.classList.replace('bg-red-900', 'bg-green-500');
                    liveBtn.classList.add('border-green-500');
                    alert("Acesso concedido. Modo Live Multimodal ativado.");
                    // Lógica para enviar o stream para análise da IA iria aqui
                } catch (err) {
                    alert("Erro ou permissão negada para Câmera/Microfone: " + err);
                }
            } else {
                // Desligar
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
                liveIndicator.classList.replace('bg-green-500', 'bg-red-900');
                liveBtn.classList.remove('border-green-500');
            }
        });

        // 4. Modo Picture-in-Picture (Janela Flutuante Document PiP API)
        pipBtn.addEventListener('click', async () => {
            if (!('documentPictureInPicture' in window)) {
                alert("Seu navegador não suporta a API de Document Picture-in-Picture.");
                return;
            }
            try {
                const pipWindow = await window.documentPictureInPicture.requestWindow({
                    width: 400,
                    height: 600,
                });
                // Copia o estilo e o chat atual para a janela flutuante
                const styles = Array.from(document.styleSheets).map(styleSheet => {
                    try { return Array.from(styleSheet.cssRules).map(rule => rule.cssText).join(''); } catch(e) { return ''; }
                }).join('\n');
                
                const styleEl = pipWindow.document.createElement('style');
                styleEl.textContent = styles;
                pipWindow.document.head.appendChild(styleEl);
                pipWindow.document.body.className = "bg-[#0d0d0f] text-white p-4";
                pipWindow.document.body.innerHTML = "<h2 class='text-orange-500 mb-4 font-bold'>A.T.H.E.N.A. Live</h2>" + chatBox.innerHTML;
            } catch (err) {
                console.error("Erro ao iniciar PiP:", err);
            }
        });

        // 5. Salvar no Obsidian (Geração de .md)
        function saveToObsidian(text) {
            const blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `Athena_Nota_${new Date().toISOString().slice(0,10)}.md`;
            a.click();
        }
    </script>
</body>
</html>
